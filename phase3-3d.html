function animateTraffic(dt){for(var j=0;j<traffic.length;j++){var q=traffic[j];q.o.position.x+=q.s*dt*12;if(q.o.position.x>500)q.o.position.x=-500}}
function updateClock(dt){clock+=dt*.15;if(clock>=24)clock=0;var h=Math.floor(clock),m=Math.floor((clock-h)*60);$('clock').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
var last=performance.now();function loop(now){var dt=Math.min(.035,(now-last)/1000);last=now;move(dt);animateTraffic(dt);animateHumans(now);updateClock(dt);var target=driving?myCar:player;var desired=new THREE.Vector3(target.position.x,target.position.y+9,target.position.z+14);camera.position.lerp(desired,.08);var look=new THREE.Vector3(target.position.x,target.position.y+2.2,target.position.z);camera.lookAt(look);renderer.render(scene,camera);requestAnimationFrame(loop)}
window.addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});updateHud();say('Phase 3 ready: roads, traffic, NPCs, doors, interiors, cars, jobs aur business system.');requestAnimationFrame(loop);
})();
</script>
