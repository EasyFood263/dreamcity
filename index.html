<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DreamCity - Phase 2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#07111f;color:#fff}button{font:inherit;touch-action:manipulation}.screen{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 15%,#294b85,transparent 35%),radial-gradient(circle at 85% 80%,#125d63,transparent 32%),#07111f}.panel{width:min(700px,100%);padding:32px;border:1px solid #ffffff20;border-radius:28px;background:#0c1b30e8;box-shadow:0 25px 90px #0008;animation:in .6s ease}.logo{font-size:54px;animation:float 2.5s ease-in-out infinite}.brand{display:flex;gap:15px;align-items:center}.brand h1{margin:0;font-size:38px}.sub{color:#aebbd0;line-height:1.6}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice,.primary{border:0;border-radius:16px;padding:15px;color:#fff;cursor:pointer}.choice{background:#132844;text-align:left;border:1px solid #ffffff18}.choice.active{outline:2px solid #76a7ff;background:#19365e}.choice span{display:block;color:#aebbd0;font-size:12px;margin-top:4px}.primary{width:100%;margin-top:18px;font-weight:800;background:linear-gradient(135deg,#6d5dfc,#22b8ff);font-size:16px;transition:.2s}.primary:hover{transform:translateY(-2px)}#game{display:none;width:100%;height:100%;position:relative}.world{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px;padding:12px}.pill,.mission,.action{background:#07111fe6;border:1px solid #ffffff20;border-radius:15px;padding:10px 12px;box-shadow:0 8px 25px #0004;backdrop-filter:blur(10px)}.points{color:#ffd86b;font-weight:900}.money{color:#71e7a1;font-weight:900}.mission{position:absolute;left:12px;bottom:12px;width:min(360px,calc(100% - 24px));pointer-events:auto}.mission h3{margin:0 0 6px}.mission p{margin:0;color:#bdc9dc;font-size:13px;line-height:1.45}.task{margin-top:8px;padding:8px;border-radius:10px;background:#ffffff0d;font-size:12px}.help{position:absolute;top:62px;right:12px;pointer-events:auto;border:1px solid #ffffff25;background:#07111fe6;color:#fff;width:40px;height:40px;border-radius:50%;font-weight:900;cursor:pointer}.controls{position:absolute;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,52px);gap:7px;pointer-events:auto}.controls button{height:52px;border:1px solid #ffffff22;border-radius:15px;background:#07111fe6;color:#fff;font-size:18px}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3;grid-row:2}.action{display:none;position:absolute;left:50%;bottom:190px;transform:translateX(-50%);pointer-events:auto;text-align:center}.action button{margin-top:8px;border:0;border-radius:11px;padding:9px 14px;background:#6d5dfc;color:#fff;font-weight:800}.toast{position:absolute;top:68px;left:50%;transform:translate(-50%,-15px);opacity:0;background:#07111ff2;border:1px solid #ffffff20;padding:11px 16px;border-radius:14px;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{display:none;position:absolute;inset:0;z-index:10;background:#020814aa;backdrop-filter:blur(7px);align-items:center;justify-content:center;padding:18px;pointer-events:auto}.modal.open{display:flex}.card{width:min(520px,100%);max-height:85vh;overflow:auto;background:#0b1b31;border:1px solid #ffffff20;border-radius:24px;padding:24px;box-shadow:0 25px 80px #0009}.card h2{margin-top:0}.card p{color:#b9c6d8;line-height:1.55}.option{width:100%;padding:14px;margin:8px 0;border-radius:14px;border:1px solid #ffffff18;background:#132844;color:#fff;text-align:left;cursor:pointer}.option b{display:block}.option small{color:#aebbd0}.close{width:100%;margin-top:12px;padding:13px;border:0;border-radius:13px;background:#263a58;color:#fff;font-weight:800;cursor:pointer}.progress{height:9px;border-radius:99px;background:#ffffff16;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#6d5dfc,#22d3ee);transition:.3s}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#ffffff12;color:#c8d4e8;font-size:11px;margin:2px}@keyframes float{50%{transform:translateY(-7px)}}@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@media(max-width:600px){.panel{padding:24px}.choices{grid-template-columns:1fr}.brand h1{font-size:31px}.mission{bottom:125px}.controls{bottom:12px}.top{font-size:12px}.action{bottom:205px;max-width:90%}}
</style>
</head>
<body>
<section id="setup" class="screen"><div class="panel"><div class="brand"><div class="logo">🏙️</div><div><h1>DreamCity</h1><div style="color:#9eb0c9">Phase 2 • Life & Career</div></div></div><p class="sub">Ab aap sirf city explore nahi karenge. NPCs se baat karo, job lo, kaam karke coins kamao aur apna pehla business shuru karo.</p><div class="choices"><button class="choice active" data-path="student"><b>🎓 Student</b><span>Education aur skills se start karo</span></button><button class="choice" data-path="other"><b>💼 Career</b><span>Job aur earning se start karo</span></button></div><button id="start" class="primary">🚀 Phase 2 Start Karo</button></div></section>
<section id="game"><canvas id="world" class="world"></canvas><div class="hud"><div class="top"><div class="pill">👤 <b id="pathLabel">Student</b> <span id="level">Lv.1</span></div><div class="pill">⭐ <span class="points" id="points">150</span> DP &nbsp; 💰 <span class="money" id="coins">50</span></div></div><button id="help" class="help">?</button><div id="toast" class="toast"></div><div id="action" class="action"><div id="actionText"></div><button id="actionBtn">Interact</button></div><div class="mission"><h3>🎯 Phase 2 Mission</h3><p id="missionText">City Office jao aur apni pehli job hasil karo.</p><div class="task"><b id="taskTitle">1/4</b> steps complete<div class="progress"><i id="bar" style="width:25%"></i></div></div></div><div class="controls"><button class="up" data-d="up">▲</button><button class="left" data-d="left">◀</button><button class="down" data-d="down">▼</button><button class="right" data-d="right">▶</button></div></div>
<div id="modal" class="modal"><div class="card" id="card"></div></div></section>
<script>
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');const setup=document.getElementById('setup'),game=document.getElementById('game');let path='student',keys={},near=null,last=0;let state={points:150,coins:50,level:1,job:null,business:false,school:false,step:0,x:0,y:0};
const places=[{id:'office',x:260,y:-80,w:220,h:150,icon:'🏢',name:'City Office',color:'#4967a5'},{id:'school',x:-500,y:-250,w:220,h:150,icon:'🏫',name:'Dream School',color:'#8c6f3e'},{id:'market',x:300,y:260,w:220,h:150,icon:'🏪',name:'Dream Market',color:'#a65369'},{id:'home',x:-380,y:300,w:220,h:150,icon:'🏠',name:'Your Home',color:'#b66c45'},{id:'park',x:-40,y:-60,w:150,h:130,icon:'🌳',name:'City Park',color:'#397d4d'}];
const npcs=[{id:'mentor',x:70,y:-250,name:'Ayesha - Career Guide',icon:'👩‍💼',color:'#ff9d7a'},{id:'worker',x:520,y:190,name:'Hamza - Shop Owner',icon:'🧑‍🍳',color:'#71b8ff'},{id:'teacher',x:-180,y:-340,name:'Sara - Teacher',icon:'👩‍🏫',color:'#c59cff'}];
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));b.classList.add('active');path=b.dataset.path});document.getElementById('start').onclick=()=>{const saved=JSON.parse(localStorage.getItem('dreamcity-phase2')||'null');if(saved)state={...state,...saved};document.getElementById('pathLabel').textContent=path==='student'?'Student':'Career';setup.style.display='none';game.style.display='block';resize();updateHUD();toast('Phase 2 mein khush aamdeed! 👋');requestAnimationFrame(loop)};
function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='e'||e.key==='Enter')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('.controls button').forEach(b=>{let d=b.dataset.d;b.onpointerdown=e=>{e.preventDefault();keys[d]=true};['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[d]=false))});
function save(){localStorage.setItem('dreamcity-phase2',JSON.stringify(state))}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}function updateHUD(){document.getElementById('points').textContent=state.points;document.getElementById('coins').textContent=state.coins;document.getElementById('level').textContent='Lv.'+state.level;let texts=['City Office jao aur apni pehli job hasil karo.','Ab Dream School jao aur ek skill lesson complete karo.','Dream Market jao aur apni pehli earning complete karo.','Hamza se baat karke apna Mini Business start karo.','🎉 Phase 2 complete! Ab aapke paas job, skill aur business hai.'];document.getElementById('missionText').textContent=texts[state.step];document.getElementById('taskTitle').textContent=Math.min(state.step+1,4)+'/4';document.getElementById('bar').style.width=Math.min(100,25*(state.step+1))+'%'}
function openModal(html){document.getElementById('card').innerHTML=html+'<button class="close" onclick="closeModal()">Close</button>';document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('help').onclick=()=>openModal('<h2>🎮 Easy Guide</h2><p><b>Move:</b> W A S D / Arrow keys ya mobile arrows.</p><p><b>Interact:</b> Kisi building ya NPC ke paas jao. Neeche button appear hoga, usay dabao.</p><p><b>Goal:</b> Job → Skill → Earning → Business.</p><div><span class="badge">🏢 Job</span><span class="badge">🏫 Skill</span><span class="badge">🏪 Earning</span><span class="badge">🧑‍🍳 Business</span></div>');
function interact(){if(!near)return;if(near.type==='place')placeAction(near.data);else npcAction(near.data)}function placeAction(p){if(p.id==='office')openModal('<h2>🏢 City Office</h2><p>Yahan aap jobs hasil kar sakte hain.</p><button class="option" onclick="takeJob()"><b>💼 Starter Job</b><small>Har work task par +25 coins aur +10 DP</small></button>');else if(p.id==='school')openModal('<h2>🏫 Dream School</h2><p>Ek basic skill lesson complete karo.</p><button class="option" onclick="learnSkill()"><b>📚 Complete Lesson</b><small>+30 Dream Points aur Skill Badge</small></button>');else if(p.id==='market')openModal('<h2>🏪 Dream Market</h2><p>'+ (state.job?'Aap work shift complete karke earning kar sakte hain.':'Pehle City Office se job lo.')+'</p><button class="option" onclick="workShift()"><b>🧾 Work Shift</b><small>+25 coins, +10 DP</small></button>');else if(p.id==='home')openModal('<h2>🏠 Your Home</h2><p>Aapki current progress safe hai.</p><p><b>Coins:</b> '+state.coins+' &nbsp; <b>Dream Points:</b> '+state.points+'</p><p>Agli phase mein yahan house upgrades aayengi.</p>');else openModal('<h2>🌳 City Park</h2><p>Thora explore karo aur NPCs se baat karo.</p>')}
function npcAction(n){if(n.id==='mentor')openModal('<h2>'+n.icon+' '+n.name+'</h2><p>"City Office se job lo. Har kaam se aapka experience barhega."</p>');else if(n.id==='teacher')openModal('<h2>'+n.icon+' '+n.name+'</h2><p>"Dream School mein lesson complete karke skill badge hasil karo."</p>');else openModal('<h2>'+n.icon+' '+n.name+'</h2><p>'+(state.step<3?'"Pehle job, skill aur market earning complete karo."':'Ab aap ready hain!')+'</p><button class="option" onclick="startBusiness()"><b>🚀 Start Mini Business</b><small>Cost: 60 coins • Reward: Business unlocked</small></button>')}
function takeJob(){if(!state.job){state.job='Starter Job';state.points+=20;if(state.step===0)state.step=1;toast('🎉 Job mil gayi! +20 DP')}else toast('Aapke paas already job hai');closeModal();updateHUD();save()}function learnSkill(){if(!state.school){state.school=true;state.points+=30;if(state.step===1)state.step=2;toast('📚 Skill complete! +30 DP')}else toast('Skill already complete hai');closeModal();updateHUD();save()}function workShift(){if(!state.job){toast('Pehle City Office se job lo');closeModal();return}state.coins+=25;state.points+=10;if(state.step===2)state.step=3;toast('💰 Earning complete! +25 coins');closeModal();updateHUD();save()}function startBusiness(){if(state.step<3){toast('Pehle 3 missions complete karo');closeModal();return}if(state.business){toast('Business already chal raha hai!');closeModal();return}if(state.coins<60){toast('Business ke liye 60 coins chahiye');closeModal();return}state.coins-=60;state.business=true;state.points+=75;state.level=2;state.step=4;toast('🚀 Mini Business unlocked! +75 DP');closeModal();updateHUD();save()}
function update(dt){let dx=0,dy=0;if(keys.w||keys.arrowup||keys.up)dy--;if(keys.s||keys.arrowdown||keys.down)dy++;if(keys.a||keys.arrowleft||keys.left)dx--;if(keys.d||keys.arrowright||keys.right)dx++;if(dx||dy){let l=Math.hypot(dx,dy);state.x+=dx/l*4*dt/16.67;state.y+=dy/l*4*dt/16.67}state.x=Math.max(-850,Math.min(850,state.x));state.y=Math.max(-520,Math.min(520,state.y));near=null;for(let p of places){let cx=p.x+p.w/2,cy=p.y+p.h/2;if(Math.hypot(state.x-cx,state.y-cy)<115)near={type:'place',data:p}}for(let n of npcs){if(Math.hypot(state.x-n.x,state.y-n.y)<75)near={type:'npc',data:n}}let a=document.getElementById('action');if(near){a.style.display='block';document.getElementById('actionText').textContent=(near.type==='place'?near.data.icon+' '+near.data.name:near.data.icon+' '+near.data.name)+' ke paas ho';document.getElementById('actionBtn').textContent='Tap karke baat karo'}else a.style.display='none'}document.getElementById('actionBtn').onclick=interact;
function draw(t){let w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#8fd182';ctx.fillRect(0,0,w,h);let cx=state.x-w/2,cy=state.y-h/2;ctx.save();ctx.translate(-cx,-cy);ctx.fillStyle='#d8c5a6';ctx.fillRect(-900,-80,1800,150);ctx.fillRect(-75,-560,150,1120);ctx.fillStyle='#59616d';ctx.fillRect(-900,-105,1800,55);ctx.fillRect(-105,-560,55,1120);ctx.strokeStyle='#f0d27a';ctx.lineWidth=4;ctx.setLineDash([20,16]);ctx.beginPath();ctx.moveTo(-900,-78);ctx.lineTo(900,-78);ctx.moveTo(-78,-560);ctx.lineTo(-78,560);ctx.stroke();ctx.setLineDash([]);for(let p of places){let bob=Math.sin(t/700+p.x)*2;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y+bob,p.w,p.h);ctx.fillStyle='#ffffff20';ctx.fillRect(p.x+10,p.y+10+bob,p.w-20,30);ctx.font='42px sans-serif';ctx.textAlign='center';ctx.fillText(p.icon,p.x+p.w/2,p.y+80+bob);ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.fillText(p.name,p.x+p.w/2,p.y+p.h+20+bob)}for(let n of npcs){let bounce=Math.sin(t/250+n.x)*2;ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(n.x,n.y+bounce,20,0,Math.PI*2);ctx.fill();ctx.font='24px sans-serif';ctx.fillText(n.icon,n.x,n.y+8+bounce);ctx.fillStyle='#102038';ctx.font='bold 11px system-ui';ctx.fillText(n.name,n.x,n.y-30+bounce)}for(let x=-800;x<850;x+=110){tree(x,-420,t);tree(x,440,t)}ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(state.x,state.y+18,17,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#625cff';ctx.beginPath();ctx.arc(state.x,state.y,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd5b5';ctx.beginPath();ctx.arc(state.x,state.y-5,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.fillText('YOU',state.x,state.y-28);ctx.restore()}
function tree(x,y,t){let s=Math.sin(t/600+x)*2;ctx.fillStyle='#69472f';ctx.fillRect(x-4,y,8,20);ctx.fillStyle='#2e864f';ctx.beginPath();ctx.arc(x+s,y,20,0,Math.PI*2);ctx.fill()}function loop(t){let dt=Math.min(40,t-last||16);last=t;update(dt);draw(t);requestAnimationFrame(loop)}
</script></body></html>
