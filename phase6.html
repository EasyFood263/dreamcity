<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamCity - Phase 6</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#07111f;color:#fff;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#0d2038;border:1px solid #ffffff20;border-radius:24px;padding:24px;margin:14px 0;box-shadow:0 20px 60px #0008;animation:up .5s ease}.hero{text-align:center;padding:40px}.logo{font-size:70px;animation:float 2s infinite}h1{font-size:42px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{padding:16px;border-radius:16px;background:#ffffff09;border:1px solid #ffffff15}.item b{display:block;font-size:22px;margin:5px 0}.bar{height:10px;background:#ffffff14;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6d5dfc,#22d3ee);transition:1s}.btn{border:0;border-radius:14px;padding:14px 20px;background:linear-gradient(135deg,#6d5dfc,#22b8ff);color:#fff;font-weight:800;cursor:pointer;margin:5px}.recap{display:none}.recap.show{display:block;animation:up .5s}.step{padding:14px;margin:8px 0;border-radius:14px;background:#ffffff08}.done{border:1px solid #4de69a55}@keyframes float{50%{transform:translateY(-8px)}}@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero{padding:25px}h1{font-size:32px}}</style></head><body><div class="wrap"><section class="card hero"><div class="logo">🌟</div><h1>DreamCity</h1><p>Phase 6 • Final Journey & Future</p><p>Ab aap apni Dream Journey ko complete karke future plan kar sakte ho.</p><button class="btn" onclick="loadJourney()">🚀 Journey Continue Karo</button></section><section id="main" class="card" style="display:none"><h2>📊 Aapki Dream Journey</h2><div class="grid"><div class="item">⭐ Dream Points<b id="dp">0</b></div><div class="item">🪙 Coins<b id="coins">0</b></div><div class="item">🏙️ City Level<b id="city">1</b></div></div><h3>Journey Progress</h3><div class="bar"><i id="bar"></i></div><div id="timeline"></div><button class="btn" onclick="recap()">🎬 Journey Recap Dekho</button><button class="btn" onclick="newJourney()">🔄 New Journey</button></section><section id="recap" class="card recap"><h2>🎬 Your DreamCity Story</h2><div id="story"></div><button class="btn" onclick="document.getElementById('recap').classList.remove('show')">Close</button></section></div><script>let s={coins:0,dp:0,city:1,job:null,business:false,jobsDone:0,journey:0};function loadJourney(){let a=JSON.parse(localStorage.getItem('dreamcity-phase4')||'null');if(a)s={...s,...a};document.getElementById('main').style.display='block';document.getElementById('dp').textContent=s.dp;document.getElementById('coins').textContent=s.coins;document.getElementById('city').textContent=s.city;let milestones=[['🎓','Education','Learning journey started'],['💼','Career','First job experience'],['🪙','Earning','Earned through work'],['🏪','Business','Started a business'],['🏙️','City','Helped develop DreamCity'],['🌟','Future','Your next dream is waiting']];document.getElementById('timeline').innerHTML=milestones.map((m,i)=>`<div class="step ${i<s.journey?'done':''}">${m[0]} <b>${m[1]}</b><small>${i<s.journey?'✅ Completed':'🔒 Next milestone'}</small></div>`).join('');document.getElementById('bar').style.width=Math.min(100,Math.max(10,s.journey/5*100))+'%'}function recap(){document.getElementById('recap').classList.add('show');document.getElementById('story').innerHTML='<div class="step">🎓 Aap ne DreamCity mein apni journey start ki.</div><div class="step">💼 Aap ne skills aur work experience hasil kiya.</div><div class="step">🏪 Aap ne earning aur business ki taraf qadam barhaya.</div><div class="step">🏙️ Aap ne apni city ko develop karna seekha.</div><div class="step done">🌟 Ab agla dream aapka hai!</div>'}function newJourney(){if(confirm('New Journey start karni hai? Current Phase 6 progress safe rahegi, lekin Phase 4 journey reset hogi.')){localStorage.removeItem('dreamcity-phase4');location.reload()}}</script></body></html>
