<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DreamCity — Living 3D City</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101820;font-family:Inter,Arial,sans-serif}#game{position:fixed;inset:0}#hud{position:fixed;inset:0;pointer-events:none;color:#fff}.top{display:flex;justify-content:space-between;padding:14px;gap:12px}.box{background:rgba(7,15,25,.82);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:11px 15px;backdrop-filter:blur(10px);box-shadow:0 8px 28px #0005}.title{font-size:18px;font-weight:800}.sub{font-size:12px;opacity:.72;margin-top:3px}#status{font-size:13px;line-height:1.45}#hint{position:fixed;left:14px;bottom:14px;max-width:460px}.buttons{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;pointer-events:auto}.buttons button,.mobile button{border:1px solid rgba(255,255,255,.16);background:rgba(7,15,25,.88);color:#fff;border-radius:14px;padding:13px 15px;font-weight:800;cursor:pointer}.mobile{display:none;position:fixed;right:14px;bottom:90px;grid-template-columns:repeat(3,54px);gap:6px;pointer-events:auto}.mobile button{height:54px;padding:0;font-size:20px}.mobile .up{grid-column:2}.mobile .down{grid-column:2}.mobile .left{grid-column:1}.mobile .right{grid-column:3;grid-row:2}.mobile .act{grid-column:1/4;width:100%;font-size:14px}.dialog{position:fixed;left:50%;bottom:115px;transform:translateX(-50%);width:min(620px,calc(100vw - 32px));display:none;pointer-events:auto}.dialog .who{font-weight:900}.dialog .text{margin-top:6px;line-height:1.45}.dialog .close{float:right;cursor:pointer}.interact{position:fixed;left:50%;top:58%;transform:translate(-50%,-50%);display:none;font-weight:900;padding:9px 14px;border-radius:999px;background:#07111de8;border:1px solid #ffffff22}.bar{height:5px;background:#ffffff18;border-radius:5px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;width:42%;background:#6bd6ff}.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);display:none}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#ffffff12;margin-right:5px;font-size:11px}@media(max-width:700px){.mobile{display:grid}.buttons{bottom:14px;left:14px;right:auto}.buttons button:nth-child(2){display:none}.box{font-size:12px}.title{font-size:15px}#hint{bottom:210px;max-width:280px}.top{padding:8px}.dialog{bottom:190px}}
</style>
</head>
<body>
<div id="game"></div><div id="hud"><div class="top"><div class="box"><div class="title">🏙️ DreamCity Pakistan</div><div class="sub">Living 3D City • Phase 1</div></div><div class="box"><span class="badge">🪙 <b id="coins">500</b></span><span class="badge">⭐ <b id="dp">300</b></span><span class="badge">🕘 <b id="clockText">08:00</b></span></div></div><div id="hint" class="box"><div><b>⬆️⬇️⬅️➡️</b> Move &nbsp; <b>Shift</b> Run &nbsp; <b>E</b> Interact</div><div class="bar"><i id="energy"></i></div><div id="status">City life start ho rahi hai. Road, log, shops aur buildings explore karein.</div></div></div>
<div id="interact" class="interact">E — interact</div><div id="dialog" class="dialog box"><span class="close" id="dialogClose">✕</span><div class="who" id="dialogWho">Citizen</div><div class="text" id="dialogText"></div></div><div id="toast" class="toast box"></div>
<div class="buttons"><button id="help">❓ Help</button><button id="reset">↻ Reset</button></div><div class="mobile"><button class="up" data-k="up">▲</button><button class="left" data-k="left">◀</button><button class="down" data-k="down">▼</button><button class="right" data-k="right">▶</button><button class="act" id="mact">E • Interact</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const root=document.getElementById('game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x9cc8e6);scene.fog=new THREE.Fog(0x9cc8e6,120,560);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,1000);camera.position.set(-100,8,-95);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdff1ff,0x415344,2));const sun=new THREE.DirectionalLight(0xfff2d5,3.2);sun.position.set(-100,150,80);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const clock=new THREE.Clock(),keys={},target=new THREE.Vector3();let mode='city',driving=false,car=null,near=null,dialogOpen=false,coins=500,dp=300,energy=100;const M={road:new THREE.MeshStandardMaterial({color:0x2d3136,roughness:.94}),lane:new THREE.MeshStandardMaterial({color:0xe9e3c7}),side:new THREE.MeshStandardMaterial({color:0xc4c0b5}),grass:new THREE.MeshStandardMaterial({color:0x3d7c49}),wall:new THREE.MeshStandardMaterial({color:0xcbbfae,roughness:.8}),glass:new THREE.MeshStandardMaterial({color:0x4f89aa,roughness:.16,metalness:.12}),wood:new THREE.MeshStandardMaterial({color:0x70462f}),white:new THREE.MeshStandardMaterial({color:0xece8dd}),red:new THREE.MeshStandardMaterial({color:0xa94138}),green:new THREE.MeshStandardMaterial({color:0x3c7c48}),yellow:new THREE.MeshStandardMaterial({color:0xd6ac43}),skin:new THREE.MeshStandardMaterial({color:0xb87855}),dark:new THREE.MeshStandardMaterial({color:0x252b34})};
function box(w,h,d,mat,x,y,z,g=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}function cyl(r,h,mat,x,y,z,g=scene){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}function label(text,color='#fff'){const c=document.createElement('canvas');c.width=640;c.height=150;const x=c.getContext('2d');x.fillStyle='rgba(3,8,14,.78)';x.roundRect(6,18,628,114,22);x.fill();x.fillStyle=color;x.font='bold 42px Arial';x.textAlign='center';x.fillText(text,320,88);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(12,2.8,1);return s}
box(560,.3,560,M.grass,0,-.2,0);function road(x,z,w,d){box(w,.08,d,M.road,x,0,z);if(w>d){for(let i=-w/2+6;i<w/2;i+=10)box(.18,.035,1.1,M.lane,x+i,.07,z)}else{for(let i=-d/2+6;i<d/2;i+=10)box(1.1,.035,.18,M.lane,x,.07,z+i)}}road(0,0,20,540);road(0,0,540,20);road(-160,0,18,540);road(160,0,18,540);road(0,-160,540,18);road(0,160,540,18);
function sidewalk(x,z,w,d){box(w,.16,d,M.side,x,.05,z)}sidewalk(-14,0,7,540);sidewalk(14,0,7,540);sidewalk(-174,0,6,540);sidewalk(-146,0,6,540);sidewalk(146,0,6,540);sidewalk(174,0,6,540);sidewalk(0,-14,540,7);sidewalk(0,14,540,7);sidewalk(0,-174,540,6);sidewalk(0,174,540,6);
function tree(x,z,scale=1){const g=new THREE.Group();g.position.set(x,0,z);cyl(.35*scale,2.8*scale,M.wood,0,1.4*scale,0,g);cyl(1.8*scale,3.3*scale,M.green,0,3.5*scale,0,g);scene.add(g)}for(let x=-245;x<=245;x+=30){tree(x,-28,.9);tree(x,28,.9)}for(let z=-245;z<=245;z+=30){tree(-28,z,.9);tree(28,z,.9)}
function building(name,x,z,w,d,h,color){const g=new THREE.Group();g.position.set(x,0,z);const wall=new THREE.MeshStandardMaterial({color,roughness:.78});box(w,h,d,wall,0,h/2,0,g);for(let xx=-w/2+4;xx<w/2-2;xx+=7){box(2.8,3.1,.09,M.glass,xx,h*.53,d/2+.05,g);if(h>12)box(2.8,3.1,.09,M.glass,xx,h*.8,d/2+.05,g)}box(3.5,5,.18,M.wood,0,2.5,d/2+.1,g);const s=label(name);s.position.set(0,h+4,0);g.add(s);g.userData={type:'building',name};scene.add(g);return g}
const house=building('YOUR HOUSE',-80,-80,30,25,11,0xc58d62),school=building('DREAM SCHOOL',80,-80,48,32,15,0xc9ced6),hospital=building('CITY HOSPITAL',-80,80,52,34,17,0xdfe4e8),office=building('CITY OFFICE',80,80,44,32,20,0x7692b5),university=building('DREAM UNIVERSITY',-230,-80,58,38,20,0xbba079),market=building('CITY MARKET',230,80,48,34,12,0x9c7352),police=building('POLICE',230,-80,40,30,13,0x53667c),fire=building('FIRE STATION',-230,80,42,30,13,0xb95646);box(90,.2,75,M.grass,0,0,-170);for(let x=-35;x<=35;x+=14)tree(x,-170,1.1);
function parkBench(x,z,r=0){const g=new THREE.Group();g.position.set(x,.1,z);g.rotation.y=r;box(5,.35,.5,M.wood,0,1,0,g);box(.35,1.8,.35,M.wood,-2,0,0,g);box(.35,1.8,.35,M.wood,2,0,0,g);scene.add(g)}parkBench(-18,-170);parkBench(18,-170,Math.PI);
function interiorRoom(){const g=new THREE.Group();g.visible=false;box(34,.2,26,M.side,0,0,0,g);box(34,7,.3,M.wall,0,3.5,-13,g);box(.3,7,26,M.wall,-17,3.5,0,g);box(.3,7,26,M.wall,17,3.5,0,g);box(34,.3,26,M.wall,0,7,0,g);box(6,3,.7,M.wood,-9,1.5,-12.7,g);box(6,3,.7,M.wood,7,1.5,-12.7,g);box(3,1.8,3,M.red,7,1,3,g);box(5,.5,2,M.white,-7,2,2,g);cyl(1.2,.5,M.yellow,0,.4,6,g);const s=label('HOME INTERIOR','#ffd66b');s.position.set(0,5,-12.4);g.add(s);scene.add(g);return g}const interior=interiorRoom();
function human(name,shirt,scale=1){const g=new THREE.Group();g.scale.setScalar(scale);box(1.15,1.9,.62,new THREE.MeshStandardMaterial({color:shirt}),0,2.15,0,g);cyl(.47,.9,M.skin,0,3.75,0,g);cyl(.49,.32,M.dark,0,4.18,0,g);const leg1=box(.38,1.65,.42,M.dark,-.3,.82,0,g),leg2=box(.38,1.65,.42,M.dark,.3,.82,0,g);const arm1=box(.28,1.5,.28,new THREE.MeshStandardMaterial({color:shirt}),-.82,2.15,0,g),arm2=box(.28,1.5,.28,new THREE.MeshStandardMaterial({color:shirt}),.82,2.15,0,g);g.userData={name,arm1,arm2,leg1,leg2,phase:Math.random()*6};return g}
const player=human('You',0x356bb0,1);player.position.set(-110,0,-110);scene.add(player);const npcData=[['Ayesha','Good morning! Main school ja rahi hoon.',0x9b4d7c],['Ali','Aaj market mein kaam hai.',0x3d7b5b],['Sara','Hospital mein meri duty hai.',0xb68b32],['Hamza','Office ke liye late ho raha hoon.',0x5c6fb2],['Bilal','Park mein milte hain.',0x8b5a3c],['Zainab','University ki class shuru hone wali hai.',0x6c4b8e]];const npcs=[];for(let i=0;i<npcData.length;i++){const n=human(npcData[i][0],npcData[i][2],.9);n.position.set(-120+i*40,0,-35+(i%2)*70);n.userData.path=i%2?'x':'z';n.userData.speed=.7+Math.random()*.45;npcs.push(n);scene.add(n)}
function carModel(color){const g=new THREE.Group();box(2.8,.7,5,new THREE.MeshStandardMaterial({color,metalness:.25,roughness:.35}),0,1,0,g);box(2.15,.75,2.25,M.glass,0,1.65,-.15,g);const wheels=[];for(const x of[-1.45,1.45])for(const z of[-1.65,1.65]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.32,18),new THREE.MeshStandardMaterial({color:0x151515}));w.rotation.z=Math.PI/2;w.position.set(x,.48,z);w.castShadow=true;g.add(w);wheels.push(w)}g.userData.wheels=wheels;return g}car=carModel(0x2367a8);car.position.set(38,.05,0);car.rotation.y=Math.PI/2;scene.add(car);const traffic=[];const carColors=[0xc44343,0x20252d,0xd2a83d,0x3f7b58,0x7c5aa6,0xe5e0d2,0x2f79a8];for(let i=0;i<16;i++){const c=carModel(carColors[i%carColors.length]);c.scale.setScalar(.82);c.position.set(-250+i*33,.05,(i%2?9:-9));c.rotation.y=Math.PI/2;c.userData.ai={speed:7+Math.random()*4,dir:i%2?1:-1,lane:c.position.z};traffic.push(c);scene.add(c)}
function streetLamp(x,z){const g=new THREE.Group();g.position.set(x,0,z);cyl(.12,7,M.dark,0,3.5,0,g);box(1.5,.15,.15,M.dark,.6,7,0,g);const l=new THREE.PointLight(0xffe6a8,.5,20);l.position.set(.6,6.7,0);g.add(l);scene.add(g)}for(let x=-240;x<=240;x+=40){streetLamp(x,-20);streetLamp(x,20)}
function nearest(){near=null;let best=12;const p=driving?car.position:player.position;const list=[{o:house,t:'🏠 House'},{o:school,t:'🏫 School'},{o:hospital,t:'🏥 Hospital'},{o:office,t:'🏢 Office'},{o:market,t:'🛒 Market'},{o:university,t:'🎓 University'},{o:police,t:'🚓 Police'},{o:fire,t:'🚒 Fire Station'}];for(const b of list){const q=new THREE.Vector3();b.o.getWorldPosition(q);const d=p.distanceTo(q);if(d<best){best=d;near={kind:'building',obj:b.o,name:b.t}}}if(!driving){const d=p.distanceTo(car.position);if(d<7)near={kind:'car',obj:car,name:'🚗 Personal Car'};for(const n of npcs){const d2=p.distanceTo(n.position);if(d2<5)near={kind:'npc',obj:n,name:n.userData.name}}}}
function showDialog(who,text){dialogOpen=true;document.getElementById('dialogWho').textContent=who;document.getElementById('dialogText').textContent=text;document.getElementById('dialog').style.display='block'}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2200)}
function interact(){nearest();if(!near){toast('Qareeb koi interactive cheez nahi.');return}if(near.kind==='npc'){const d=npcData.find(x=>x[0]===near.obj.userData.name);showDialog(near.obj.userData.name,d?d[1]:'Assalam-o-alaikum!');return}if(near.kind==='car'){driving=true;player.visible=false;toast('🚗 Car mein baith gaye — Arrow Keys se drive karein');return}if(near.obj===house){interior.visible=true;mode='interior';player.position.set(0,0,8);player.rotation.y=Math.PI;toast('🏠 Ghar ke andar aa gaye');return}showDialog(near.name,'Yahan complete 3D interior, jobs, rooms aur activities ko next development phase mein expand kiya jayega.')}
function exitInterior(){interior.visible=false;mode='city';player.position.set(-80,0,-63);toast('🏙️ City mein wapas aa gaye')}function exitCar(){driving=false;player.visible=true;player.position.copy(car.position).add(new THREE.Vector3(4,0,0));toast('🚗 Car se bahar aa gaye')}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Shift','e','E'].includes(e.key))e.preventDefault();if(e.key==='ArrowUp')keys.up=true;if(e.key==='ArrowDown')keys.down=true;if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key==='Shift')keys.shift=true;if(e.key.toLowerCase()==='e'){if(dialogOpen){document.getElementById('dialog').style.display='none';dialogOpen=false}else if(mode==='interior')exitInterior();else if(driving)exitCar();else interact()}});addEventListener('keyup',e=>{if(e.key==='ArrowUp')keys.up=false;if(e.key==='ArrowDown')keys.down=false;if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;if(e.key==='Shift')keys.shift=false});for(const b of document.querySelectorAll('[data-k]')){b.addEventListener('pointerdown',e=>{e.preventDefault();keys[b.dataset.k]=true});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[b.dataset.k]=false))}document.getElementById('mact').onclick=()=>{if(dialogOpen){document.getElementById('dialog').style.display='none';dialogOpen=false}else if(mode==='interior')exitInterior();else if(driving)exitCar();else interact()};document.getElementById('dialogClose').onclick=()=>{document.getElementById('dialog').style.display='none';dialogOpen=false};document.getElementById('reset').onclick=()=>location.reload();document.getElementById('help').onclick=()=>alert('⬆️⬇️⬅️➡️ Move • Shift Run • E Talk/Enter/Exit • Arrow Keys drive car. Mobile par neeche arrows use karein.');
function animateHuman(g,t,moving){const u=g.userData;if(!u)return;const s=moving?Math.sin(t*10+u.phase):0;u.arm1.rotation.z=s*.38;u.arm2.rotation.z=-s*.38;u.leg1.rotation.z=-s*.25;u.leg2.rotation.z=s*.25}
function move(dt){if(dialogOpen)return;if(mode==='interior'){const dx=(keys.right?1:0)-(keys.left?1:0),dz=(keys.down?1:0)-(keys.up?1:0),len=Math.hypot(dx,dz);if(len){const v=(keys.shift?7:4)*dt;player.position.x+=dx/len*v;player.position.z+=dz/len*v;player.rotation.y=Math.atan2(dx/len,dz/len);animateHuman(player,clock.elapsedTime,true)}else animateHuman(player,clock.elapsedTime,false);return}if(driving){const throttle=(keys.up?13:0)-(keys.down?7:0);car.rotation.y+=((keys.right?1:0)-(keys.left?1:0))*dt*1.5;car.position.x+=Math.sin(car.rotation.y)*throttle*dt;car.position.z+=Math.cos(car.rotation.y)*throttle*dt;for(const w of car.userData.wheels)w.rotation.x-=throttle*dt*2;return}const dx=(keys.right?1:0)-(keys.left?1:0),dz=(keys.down?1:0)-(keys.up?1:0),len=Math.hypot(dx,dz);if(len){const v=(keys.shift&&energy>1?9:5)*dt;player.position.x+=dx/len*v;player.position.z+=dz/len*v;player.rotation.y=Math.atan2(dx/len,dz/len);animateHuman(player,clock.elapsedTime,true);if(keys.shift)energy=Math.max(0,energy-25*dt)}else{animateHuman(player,clock.elapsedTime,false);energy=Math.min(100,energy+12*dt)}player.position.x=THREE.MathUtils.clamp(player.position.x,-255,255);player.position.z=THREE.MathUtils.clamp(player.position.z,-255,255)}
function ai(dt){for(const c of traffic){c.position.x+=c.userData.ai.speed*c.userData.ai.dir*dt;if(c.position.x>270)c.position.x=-270;if(c.position.x<-270)c.position.x=270;for(const w of c.userData.wheels)w.rotation.x-=c.userData.ai.speed*dt*1.5}npcs.forEach((n,i)=>{const u=n.userData,sp=u.speed*dt;if(u.path==='x'){n.position.x+=sp;if(n.position.x>150)n.position.x=-150}else{n.position.z+=sp;if(n.position.z>150)n.position.z=-150}animateHuman(n,clock.elapsedTime,true)})}
function cameraFollow(){const p=driving?car.position:player.position,ang=driving?car.rotation.y:player.rotation.y,back=driving?11:9;const desired=new THREE.Vector3(p.x-Math.sin(ang)*back,driving?5.7:5,p.z-Math.cos(ang)*back);camera.position.lerp(desired,.1);target.set(p.x,p.y+2.2,p.z);camera.lookAt(target)}function updateUI(){document.getElementById('energy').style.width=energy+'%';document.getElementById('coins').textContent=coins;document.getElementById('dp').textContent=dp;const h=8+Math.floor((clock.elapsedTime/60)%10),m=Math.floor(clock.elapsedTime%60);document.getElementById('clockText').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');nearest();const ie=document.getElementById('interact');if(near&&!dialogOpen){ie.style.display='block';ie.textContent=near.kind==='npc'?'E — baat karein':'E — '+near.name}else ie.style.display='none';if(near&&!dialogOpen)document.getElementById('status').textContent=near.kind==='npc'?near.obj.userData.name+' se baat karein.':near.name+' ke qareeb hain.'}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);move(dt);ai(dt);if(mode==='city')cameraFollow();else{camera.position.lerp(new THREE.Vector3(player.position.x,5,player.position.z+12),.08);camera.lookAt(player.position.x,2,player.position.z)}updateUI();renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});animate();
</script></body></html>
