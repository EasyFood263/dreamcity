<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DreamCity — Phase 1 3D Living City</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}#game{position:fixed;inset:0}#hud{position:fixed;inset:0;pointer-events:none;color:#fff}.top{display:flex;justify-content:space-between;padding:14px}.box{background:#07111ddd;border:1px solid #ffffff25;border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px)}#hint{position:fixed;left:14px;bottom:14px;max-width:430px}.buttons{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;pointer-events:auto}.buttons button,.mobile button{border:1px solid #ffffff25;background:#07111ddd;color:#fff;border-radius:14px;padding:13px;font-weight:700}.mobile{display:none;position:fixed;right:14px;bottom:90px;grid-template-columns:repeat(3,52px);gap:6px;pointer-events:auto}.mobile button{height:52px;font-size:18px}.mobile .up{grid-column:2}.mobile .down{grid-column:2}.mobile .left{grid-column:1}.mobile .right{grid-column:3;grid-row:2}.mobile .act{grid-column:1/4;width:100%}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07111f;color:#fff;font-size:20px;z-index:5}#cross{position:fixed;left:50%;top:50%;width:8px;height:8px;border:1px solid #fff;border-radius:50%;transform:translate(-50%,-50%);opacity:.7}
@media(max-width:700px){.mobile{display:grid}.buttons{bottom:14px;left:14px;right:auto}.buttons button:nth-child(2){display:none}.box{font-size:12px}#hint{bottom:205px;max-width:260px}.top{padding:8px}}
</style>
</head>
<body>
<div id="loading">DreamCity 3D world load ho rahi hai…</div><div id="game"></div><div id="cross"></div>
<div id="hud"><div class="top"><div class="box"><b>🏙️ DreamCity</b><br><small>Phase 1 • 3D Living District</small></div><div class="box">🪙 <b id="coins">500</b> &nbsp; ⭐ <b id="dp">300</b></div></div><div id="hint" class="box">WASD / Arrow = move &nbsp; • &nbsp; Shift = run &nbsp; • &nbsp; E = interact<br><b id="status">City street — ghar, road aur traffic explore karein.</b></div></div>
<div class="buttons"><button id="help">❓ Help</button><button id="reset">↻ Reset</button></div>
<div class="mobile"><button class="up" data-k="w">▲</button><button class="left" data-k="a">◀</button><button class="down" data-k="s">▼</button><button class="right" data-k="d">▶</button><button class="act" id="mact">E • Interact</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const root=document.getElementById('game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc8e5);scene.fog=new THREE.Fog(0x9fc8e5,100,520);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,900);camera.position.set(0,5,10);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xddeeff,0x4b5a43,2.1));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-80,130,70);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const clock=new THREE.Clock(),keys={};let mode='city',near=null,car=null,driving=false,coins=500,dp=300;
const mats={road:new THREE.MeshStandardMaterial({color:0x292d32,roughness:.95}),side:new THREE.MeshStandardMaterial({color:0xb7b3a8}),grass:new THREE.MeshStandardMaterial({color:0x3f7d48}),wall:new THREE.MeshStandardMaterial({color:0xc8bda9}),glass:new THREE.MeshStandardMaterial({color:0x477da1,metalness:.1,roughness:.2}),wood:new THREE.MeshStandardMaterial({color:0x68432e}),white:new THREE.MeshStandardMaterial({color:0xe9e4d8}),red:new THREE.MeshStandardMaterial({color:0x9d3b32}),green:new THREE.MeshStandardMaterial({color:0x397044}),yellow:new THREE.MeshStandardMaterial({color:0xd4a83e})};
function box(w,h,d,mat,x,y,z,group=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;group.add(m);return m}
function cyl(r,h,mat,x,y,z,group=scene){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;group.add(m);return m}
function textSprite(text,color='#fff'){const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.fillStyle='rgba(0,0,0,.6)';x.roundRect(5,15,502,98,18);x.fill();x.fillStyle=color;x.font='bold 42px Arial';x.textAlign='center';x.fillText(text,256,77);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(10,2.5,1);return s}
// ground and a large connected street grid
box(520,0.3,520,mats.grass,0,-.2,0);
function road(x,z,w,d){box(w,.08,d,mats.road,x,0,z);if(w>d){for(let i=-w/2+6;i<w/2;i+=10)box(.15,.03,.9,mats.white,x+i,.07,z)}else{for(let i=-d/2+6;i<d/2;i+=10)box(.9,.03,.15,mats.white,x,.07,z+i)}}
road(0,0,18,500);road(0,0,500,18);road(-150,0,16,500);road(150,0,16,500);road(0,-150,500,16);road(0,150,500,16);
function sidewalk(x,z,w,d){box(w,.16,d,mats.side,x,.05,z)}sidewalk(-12,0,6,500);sidewalk(12,0,6,500);sidewalk(-150-11,0,5,500);sidewalk(-150+11,0,5,500);sidewalk(150-11,0,5,500);sidewalk(150+11,0,5,500);sidewalk(0,-12,500,6);sidewalk(0,12,500,6);
function tree(x,z){const g=new THREE.Group();cyl(.35,2.8,mats.wood,x,1.4,z,g);cyl(1.8,3.2,mats.green,x,3.5,z,g);scene.add(g)}
for(let x=-230;x<=230;x+=35){tree(x,-25);tree(x,25)}for(let z=-230;z<=230;z+=35){tree(-25,z);tree(25,z)}
function building(name,x,z,w,d,h,color,door=true){const g=new THREE.Group();g.position.set(x,0,z);const wall=new THREE.MeshStandardMaterial({color,roughness:.8});box(w,h,d,wall,0,h/2,0,g);for(let xx=-w/2+4;xx<w/2-2;xx+=7){box(2.8,3.2,.08,mats.glass,xx,h*.55,d/2+.05,g);box(2.8,3.2,.08,mats.glass,xx,h*.82,d/2+.05,g)}if(door){box(3.2,5,.15,mats.wood,0,2.5,d/2+.1,g);g.userData={type:'building',name,inside:new THREE.Vector3(x,z)} }g.add(textSprite(name));g.children[g.children.length-1].position.set(0,h+4,0);scene.add(g);return g}
const house=building('Your House',-75,-75,28,24,10,0xc48f65);const school=building('Dream School',75,-75,45,30,14,0xc4c8d0);const hospital=building('City Hospital',-75,75,48,32,16,0xd7dce2);const office=building('City Office',75,75,40,30,18,0x7e95b4);building('University',-220,-75,52,34,18,0xb9a07b);building('Market',220,75,45,32,11,0x9b7656);
// park
box(70,.2,70,mats.grass,0,0,-150);for(let x=-25;x<=25;x+=12){tree(x,-150)}
// interior room, initially hidden
const interior=new THREE.Group();interior.visible=false;scene.add(interior);box(26,.2,20,mats.side,0,0,0,interior);box(26,6,.3,mats.wall,0,3,-10,interior);box(.3,6,20,mats.wall,-13,3,0,interior);box(.3,6,20,mats.wall,13,3,0,interior);box(26,.3,20,mats.wall,0,6,0,interior);box(5,3,.6,mats.wood,-7,1.5,-9.7,interior);box(5,3,.6,mats.wood,6,1.5,-9.7,interior);box(3,1.8,3,mats.red,5,1,2,interior);box(4,.5,2,mats.white,-6,2,1,interior);cyl(1.1,.5,mats.yellow,0,.4,5,interior);const label=textSprite('HOUSE INTERIOR','#ffd66b');label.position.set(0,5,-9.5);interior.add(label);
// procedural human with animated limbs
function human(){const g=new THREE.Group();const skin=new THREE.MeshStandardMaterial({color:0xb87955});const shirt=new THREE.MeshStandardMaterial({color:0x3564a8});const pants=new THREE.MeshStandardMaterial({color:0x252a35});box(1.2,2,.65,shirt,0,2.2,0,g);cyl(.48,1,skin,0,3.8,0,g);box(.4,1.7,.45,pants,-.32,.85,0,g);box(.4,1.7,.45,pants,.32,.85,0,g);const la=box(.3,1.55,.3,shirt,-.9,2.15,0,g);const ra=box(.3,1.55,.3,shirt,.9,2.15,0,g);g.userData={la,ra,legs:g.children.slice(1,3)};return g}
const player=human();player.position.set(-105,.0,-105);scene.add(player);
function carModel(color=0x245b9b){const g=new THREE.Group();box(2.6,.65,4.8,new THREE.MeshStandardMaterial({color,metalness:.1,roughness:.45}),0,1,0,g);box(2.1,.75,2.1,mats.glass,0,1.65,-.2,g);const wheels=[];for(const x of [-1.3,1.3])for(const z of [-1.65,1.65]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.3,18),new THREE.MeshStandardMaterial({color:0x171717}));w.rotation.z=Math.PI/2;w.position.set(x,.5,z);w.castShadow=true;g.add(w);wheels.push(w)}g.userData={wheels};return g}
car=carModel(0x1f5c8e);car.position.set(35,.05,0);car.rotation.y=Math.PI/2;scene.add(car);for(let i=0;i<9;i++){const c=carModel([0x8b2f2f,0x202020,0xb48b32,0x3d6d45][i%4]);c.scale.setScalar(.85);c.position.set(-190+i*45,.05,Math.sin(i)*7);c.rotation.y=Math.PI/2;scene.add(c);c.userData.ai={speed:.8+Math.random()*.7,baseZ:c.position.z}};
// traffic lights
function light(x,z){const g=new THREE.Group();cyl(.12,7,mats.wood,x,3.5,z,g);box(.8,2,.6,mats.red,x,6,z,g);scene.add(g)}light(-10,-10);light(10,10);
const target=new THREE.Vector3();
function nearest(){near=null;let best=999;const p=driving?car.position:player.position;for(const item of [{o:house,n:'🏠 House — E se andar enter karein'},{o:school,n:'🏫 School — Phase 1 building'},{o:hospital,n:'🏥 Hospital — Phase 1 building'},{o:office,n:'🏢 Office — Phase 1 building'}]){const q=new THREE.Vector3();item.o.getWorldPosition(q);const d=p.distanceTo(q);if(d<10&&d<best){best=d;near={kind:'building',obj:item.o,name:item.n}}}const d=p.distanceTo(car.position);if(!driving&&d<6){near={kind:'car',obj:car,name:'🚗 Apni car — E se enter karein'}}}
function interact(){nearest();if(!near){document.getElementById('status').textContent='Qareeb koi interaction nahi.';return}if(near.kind==='car'){driving=true;player.visible=false;camera.position.set(car.position.x,4,car.position.z+9);document.getElementById('status').textContent='🚗 Car mein baith gaye. W/S drive, A/D turn, E bahar niklein.';return}if(near.obj===house){interior.visible=true;mode='interior';player.visible=true;player.position.set(0,0,7);player.rotation.y=Math.PI;document.getElementById('status').textContent='🏠 House ke andar: rooms, furniture aur doors ka prototype. E se bahar.';return}document.getElementById('status').textContent=near.name+' — complete interior Phase 2 mein expand hoga.'}
function exitInterior(){if(mode==='interior'){interior.visible=false;mode='city';player.position.set(-75,0,-90);document.getElementById('status').textContent='🏙️ City mein wapas aa gaye.'}}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e'){if(mode==='interior')exitInterior();else interact()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
for(const b of document.querySelectorAll('[data-k]')){b.addEventListener('pointerdown',e=>{e.preventDefault();keys[b.dataset.k]=true});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[b.dataset.k]=false))}document.getElementById('mact').onclick=()=>{if(mode==='interior')exitInterior();else interact()};document.getElementById('reset').onclick=()=>location.reload();document.getElementById('help').onclick=()=>alert('WASD/Arrows: move • Shift: run • E: interact • House ke darwaze par E = interior • Car ke paas E = drive • Car mein E = exit.');
function move(dt){if(mode==='interior'){let dx=(keys.d?1:0)-(keys.a?1:0),dz=(keys.s?1:0)-(keys.w?1:0);const v=(keys.shift?7:4)*dt;player.position.x+=dx*v;player.position.z+=dz*v;return}if(driving){const v=(keys.w?10:0)-(keys.s?6:0);car.rotation.y+=(keys.d?1:-keys.a?1:0)*dt*1.6;car.position.x+=Math.sin(car.rotation.y)*v*dt;car.position.z+=Math.cos(car.rotation.y)*v*dt;return}let dx=(keys.d?1:0)-(keys.a?1:0),dz=(keys.s?1:0)-(keys.w?1:0);if(dx||dz){const len=Math.hypot(dx,dz);dx/=len;dz/=len;const v=(keys.shift?9:5)*dt;player.position.x+=dx*v;player.position.z+=dz*v;player.rotation.y=Math.atan2(dx,dz);const t=clock.elapsedTime*10;player.userData.la.rotation.z=Math.sin(t)*.35;player.userData.ra.rotation.z=-Math.sin(t)*.35;player.userData.legs[0].rotation.z=-Math.sin(t)*.25;player.userData.legs[1].rotation.z=Math.sin(t)*.25}else{player.userData.la.rotation.z*=.85;player.userData.ra.rotation.z*=.85;player.userData.legs[0].rotation.z*=.85;player.userData.legs[1].rotation.z*=.85}}
function ai(dt){scene.traverse(o=>{if(o.userData.ai){o.position.x+=o.userData.ai.speed*dt*5;if(o.position.x>245)o.position.x=-245;o.position.z=o.userData.ai.baseZ+Math.sin(clock.elapsedTime*1.2+o.position.x*.02)*5;o.rotation.y=Math.PI/2}})}
function cameraFollow(){let p=driving?car.position:player.position;let back=driving?10:9;let ang=driving?car.rotation.y:player.rotation.y;const desired=new THREE.Vector3(p.x-Math.sin(ang)*back,driving?5.2:4.5,p.z-Math.cos(ang)*back);camera.position.lerp(desired,.09);target.set(p.x,p.y+2,p.z);camera.lookAt(target)}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);move(dt);ai(dt);if(mode==='city')cameraFollow();else{camera.position.lerp(new THREE.Vector3(player.position.x,5,player.position.z+11),.08);camera.lookAt(player.position.x,2,player.position.z)}nearest();if(near)document.getElementById('status').textContent=near.name;renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
document.getElementById('loading').remove();animate();
</script></body></html>
