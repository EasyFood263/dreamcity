<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DreamCity 3D — Living Pakistan City</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#9ec9e8;font-family:Inter,Arial,sans-serif}#game{position:fixed;inset:0}#hud{position:fixed;inset:0;color:#fff;pointer-events:none}.panel{background:rgba(7,15,25,.86);border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 30px #0005;backdrop-filter:blur(10px);border-radius:16px}.top{display:flex;justify-content:space-between;padding:16px}.brand{padding:12px 16px}.brand b{font-size:19px}.stats{padding:12px 16px}.hint{position:fixed;left:16px;bottom:16px;padding:12px 16px;max-width:470px}.hint b{color:#ffd45c}.actions{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;pointer-events:auto}.actions button,.mobile button{border:1px solid #fff2;background:#081321e8;color:#fff;border-radius:13px;padding:12px 15px;font-weight:800;cursor:pointer}.mobile{display:none;position:fixed;right:16px;bottom:90px;grid-template-columns:repeat(3,54px);gap:6px;pointer-events:auto}.mobile button{height:54px;padding:0;font-size:20px}.mobile .up{grid-column:2}.mobile .left{grid-column:1;grid-row:2}.mobile .down{grid-column:2;grid-row:2}.mobile .right{grid-column:3;grid-row:2}.mobile .act{grid-column:1/4;font-size:14px}#toast{position:fixed;left:50%;top:20%;transform:translateX(-50%);padding:13px 20px;opacity:0;transition:.25s}.cross{position:fixed;left:50%;top:50%;width:7px;height:7px;border:1px solid #fff;border-radius:50%;transform:translate(-50%,-50%)}@media(max-width:700px){.mobile{display:grid}.hint{bottom:210px;max-width:270px}.top{padding:8px}.brand b{font-size:15px}.stats{font-size:12px}.actions{left:8px;right:auto;bottom:8px}}
</style></head><body><div id="game"></div><div class="cross"></div><div id="hud"><div class="top"><div class="panel brand"><b>🏙️ DreamCity Pakistan</b><br><small>Living City • Real-world style prototype</small></div><div class="panel stats">🪙 <b id="coins">500</b> &nbsp; ⭐ <b>300</b> &nbsp; 🕘 <b id="clock">08:00</b></div></div><div id="hint" class="panel hint">⬆️⬇️⬅️➡️ <b>Move</b> &nbsp; Shift <b>Run</b> &nbsp; E <b>Interact</b><br><span id="status">Road par chalien. Buildings ke entrance dhoondhein.</span></div><div id="toast" class="panel"></div><div class="actions"><button id="help">❓ Help</button><button id="reset">↻ Reset</button></div></div><div class="mobile"><button class="up" data-k="up">▲</button><button class="left" data-k="left">◀</button><button class="down" data-k="down">▼</button><button class="right" data-k="right">▶</button><button class="act" id="mact">E • Interact</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const root=document.querySelector('#game'),statusEl=document.querySelector('#status'),toast=document.querySelector('#toast');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec9e8);scene.fog=new THREE.Fog(0x9ec9e8,120,650);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff3ff,0x3d4b35,2.2));const sun=new THREE.DirectionalLight(0xfff3d5,3.2);sun.position.set(-100,150,80);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const M={road:new THREE.MeshStandardMaterial({color:0x292d31,roughness:1}),side:new THREE.MeshStandardMaterial({color:0xbdb8ac,roughness:1}),grass:new THREE.MeshStandardMaterial({color:0x4f874b,roughness:1}),curb:new THREE.MeshStandardMaterial({color:0xe3ddd0}),wall:new THREE.MeshStandardMaterial({color:0xd2c5ae,roughness:.9}),glass:new THREE.MeshStandardMaterial({color:0x4f87a8,roughness:.18,metalness:.15}),wood:new THREE.MeshStandardMaterial({color:0x6b432c}),metal:new THREE.MeshStandardMaterial({color:0x20262d,metalness:.65,roughness:.3}),white:new THREE.MeshStandardMaterial({color:0xf3eee2}),red:new THREE.MeshStandardMaterial({color:0xb63d35}),green:new THREE.MeshStandardMaterial({color:0x39734a}),blue:new THREE.MeshStandardMaterial({color:0x3569a5}),yellow:new THREE.MeshStandardMaterial({color:0xe4b63f})};
function box(w,h,d,mat,x,y,z,g=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;g.add(o);return o}function cyl(r,h,mat,x,y,z,g=scene){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20),mat);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;g.add(o);return o}
box(700,.2,700,M.grass,0,-.12,0);function road(x,z,w,d){box(w,.08,d,M.road,x,0,z);if(w>d)for(let i=-w/2+4;i<w/2;i+=9)box(4,.025,.13,M.yellow,x+i,.07,z);else for(let i=-d/2+4;i<d/2;i+=9)box(.13,.025,4,M.yellow,x,.07,z+i)}
function sidewalk(x,z,w,d){box(w,.18,d,M.side,x,.05,z);if(w>d){box(.25,.22,d,M.curb,x+w/2-.2,.13,z);box(.25,.22,d,M.curb,x-w/2+.2,.13,z)}else{box(w,.22,.25,M.curb,x,.13,z+d/2-.2);box(w,.22,.25,M.curb,x,.13,z-d/2+.2)}}
road(0,0,24,700);road(0,0,700,24);road(-210,0,18,700);road(210,0,18,700);road(0,-210,700,18);road(0,210,700,18);sidewalk(-16,0,7,700);sidewalk(16,0,7,700);sidewalk(-222,0,6,700);sidewalk(222,0,6,700);sidewalk(0,-16,700,7);sidewalk(0,16,700,7);
function tree(x,z){const g=new THREE.Group();cyl(.35,3,M.wood,x,1.5,z,g);cyl(1.6,3,M.green,x,3.8,z,g);scene.add(g)}function lamp(x,z){const g=new THREE.Group();cyl(.09,6,M.metal,x,3,z,g);box(.7,.16,.7,M.yellow,x,6.1,z,g);scene.add(g)}
for(let i=-300;i<=300;i+=30){tree(i,-27);tree(i,27);lamp(i,-21);lamp(i,21)}for(let i=-300;i<=300;i+=30){tree(-27,i);tree(27,i);lamp(-21,i);lamp(21,i)}
function label(t){const c=document.createElement('canvas');c.width=600;c.height=140;const x=c.getContext('2d');x.fillStyle='rgba(5,12,20,.78)';x.roundRect(5,10,590,120,20);x.fill();x.fillStyle='#fff';x.font='bold 42px Arial';x.textAlign='center';x.fillText(t,300,88);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(10,2.35,1);return s}
const buildings=[];function building(name,x,z,w,d,floors,color){const g=new THREE.Group();g.position.set(x,0,z);const wall=new THREE.MeshStandardMaterial({color,roughness:.82});box(w,floors*4,d,wall,0,floors*2,0,g);for(let floor=0;floor<floors;floor++)for(let xx=-w/2+4;xx<w/2-2;xx+=6){box(2.8,2.1,.08,M.glass,xx,2.2+floor*4,d/2+.05,g);box(2.8,2.1,.08,M.glass,xx,2.2+floor*4,-d/2-.05,g)}for(let floor=0;floor<floors;floor++)box(w-.8,.08,.08,M.white,0,4+floor*4,d/2+.1,g);box(4,3.6,.2,M.wood,0,1.8,d/2+.12,g);box(4.8,.3,.7,M.metal,0,3.9,d/2+.25,g);const l=label(name);l.position.set(0,floors*4+3,0);g.add(l);g.userData={name,entrance:new THREE.Vector3(x,0,z+d/2+3)};scene.add(g);buildings.push(g);return g}
const house=building('YOUR HOUSE',-75,-75,30,24,2,0xc58e62),school=building('DREAM SCHOOL',75,-75,55,34,3,0xc9ced5),hospital=building('CITY HOSPITAL',-75,75,58,38,4,0xdfe5e9),office=building('CITY OFFICE',75,75,48,34,5,0x7894b4),univ=building('UNIVERSITY',-225,-75,64,40,5,0xb49a78),market=building('CITY MARKET',225,75,58,38,2,0x9d704e),police=building('POLICE',-225,75,38,28,2,0x6d86a5),fire=building('FIRE STATION',225,-75,44,30,2,0xb84b3d);
function park(x,z){box(75,.12,75,M.grass,x,0,z);for(let a=-25;a<=25;a+=12){tree(x+a,z-28);tree(x+a,z+28)}for(let a=-15;a<=15;a+=15){box(4,.6,1,M.wood,x+a,z,0+0);box(1.8,.7,5,M.white,x+a,z+.1,z*0+0)}}park(0,-150);
function human(shirt=M.blue,skin=0xb87955){const g=new THREE.Group(),S=new THREE.MeshStandardMaterial({color:shirt}),K=new THREE.MeshStandardMaterial({color:skin}),P=new THREE.MeshStandardMaterial({color:0x242934});box(1.15,1.7,.62,S,0,2.4,0,g);cyl(.46,.9,K,0,3.7,0,g);const l=box(.34,1.7,.38,S,-.82,2.35,0,g),r=box(.34,1.7,.38,S,.82,2.35,0,g),a=box(.38,1.7,.42,P,-.28,.85,0,g),b=box(.38,1.7,.42,P,.28,.85,0,g);g.userData={l,r,a,b,phase:Math.random()*6.28};return g}
const player=human(0x2e68a6);player.position.set(-105,0,-105);scene.add(player);let driving=false,car;
function carModel(color){const g=new THREE.Group(),body=new THREE.MeshStandardMaterial({color,metalness:.35,roughness:.35});box(3.2,.8,5.8,body,0,1,0,g);box(2.65,.85,2.7,M.glass,0,1.65,-.35,g);box(2.9,.15,M.white,0,0,0,g);for(const x of[-1.65,1.65])for(const z of[-2,2]){const w=cyl(.48,.36,M.metal,x,.48,z,g);w.rotation.z=Math.PI/2}return g}car=carModel(0x1d5d96);car.position.set(42,.1,0);car.rotation.y=Math.PI/2;scene.add(car);
const traffic=[];for(let i=0;i<14;i++){const c=carModel([0x9f302e,0x20242a,0xc79d32,0x3d7048,0x6b5aa8][i%5]);c.scale.setScalar(.78);c.position.set(-320+i*45,.08,(i%2?5:-5));c.rotation.y=Math.PI/2;scene.add(c);traffic.push({o:c,s:.65+Math.random()*.8})}
const npcs=[];for(let i=0;i<12;i++){const n=human([0x2e68a6,0x8d4b3d,0x3c7652,0x8a6aaf][i%4]);n.position.set(-170+Math.random()*340,0,-170+Math.random()*340);n.userData.target=new THREE.Vector3(-200+Math.random()*400,0,-200+Math.random()*400);scene.add(n);npcs.push(n)}
const interior=new THREE.Group();scene.add(interior);interior.visible=false;function room(w,d){box(w,.15,d,M.side,0,0,0,interior);box(w,5,.25,M.wall,0,2.5,-d/2,interior);box(.25,5,d,M.wall,-w/2,2.5,0,interior);box(.25,5,d,M.wall,w/2,2.5,0,interior)}room(28,22);box(5,2.4,2,M.red,5,1,2,interior);box(4,1,2,M.wood,-5,.5,-2,interior);box(3,3,.3,M.glass,0,2.3,-10.8,interior);const il=label('HOUSE • LIVING ROOM');il.position.set(0,4,-10);interior.add(il);
let mode='city',keys={},near=null,coins=500;function say(t){statusEl.textContent=t;toast.textContent=t;toast.style.opacity=1;setTimeout(()=>toast.style.opacity=0,1800)}function nearest(){near=null;let p=driving?car.position:player.position,b=999;for(const x of buildings){const q=x.userData.entrance,d=p.distanceTo(q);if(d<12&&d<b){b=d;near={type:'building',o:x}}}if(!driving&&p.distanceTo(car.position)<7)near={type:'car'};for(const n of npcs){const d=p.distanceTo(n.position);if(d<5){near={type:'npc',o:n};break}}}
function interact(){nearest();if(!near){say('Qareeb koi interaction nahi. Entrance, NPC ya car ke paas jayein.');return}if(near.type==='npc'){say('NPC: Assalam-o-Alaikum! Aaj city mein nayi job openings hain.');return}if(near.type==='car'){driving=true;player.visible=false;say('🚗 Car mein baith gaye — arrows se drive karein, E se bahar niklein.');return}if(near.o===house){interior.visible=true;mode='interior';player.position.set(0,0,7);say('🏠 House ke andar aa gaye. Furniture aur living room explore karein. E = bahar.')}}function exit(){interior.visible=false;mode='city';player.position.set(-75,0,-88);say('🏙️ Wapas city mein.')}addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Shift','e','E'].includes(e.key))e.preventDefault();if(e.key==='ArrowUp')keys.up=1;if(e.key==='ArrowDown')keys.down=1;if(e.key==='ArrowLeft')keys.left=1;if(e.key==='ArrowRight')keys.right=1;if(e.key==='Shift')keys.run=1;if(e.key.toLowerCase()==='e'){if(mode==='interior')exit();else if(driving){driving=false;player.visible=true;player.position.copy(car.position).add(new THREE.Vector3(3,0,0));say('🚶 Car se bahar aa gaye.')}else interact()}});addEventListener('keyup',e=>{if(e.key==='ArrowUp')keys.up=0;if(e.key==='ArrowDown')keys.down=0;if(e.key==='ArrowLeft')keys.left=0;if(e.key==='ArrowRight')keys.right=0;if(e.key==='Shift')keys.run=0});document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();keys[b.dataset.k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys[b.dataset.k]=0});mact.onclick=()=>{if(mode==='interior')exit();else interact()};help.onclick=()=>alert('⬆️⬇️⬅️➡️ Move\nShift Run\nE Interact\nBuilding ke front door par E = enter\nNPC ke paas E = conversation\nCar ke paas E = drive\nCar mein E = exit');reset.onclick=()=>location.reload();
function animate(dt){if(mode==='interior'){let x=(keys.right?1:0)-(keys.left?1:0),z=(keys.down?1:0)-(keys.up?1:0);player.position.x+=x*7*dt;player.position.z+=z*7*dt;player.position.x=THREE.MathUtils.clamp(player.position.x,-11,11);player.position.z=THREE.MathUtils.clamp(player.position.z,-8,8);camera.position.lerp(new THREE.Vector3(player.position.x,5,player.position.z+10),.12);camera.lookAt(player.position.x,2,player.position.z);return}if(driving){let f=(keys.up?1:0)-(keys.down?1:0),turn=(keys.right?1:0)-(keys.left?1:0);car.rotation.y-=turn*1.8*dt;car.position.x+=Math.sin(car.rotation.y)*f*16*dt;car.position.z+=Math.cos(car.rotation.y)*f*16*dt;camera.position.lerp(car.position.clone().add(new THREE.Vector3(-Math.sin(car.rotation.y)*9,5,-Math.cos(car.rotation.y)*9)),.08);camera.lookAt(car.position);return}let x=(keys.right?1:0)-(keys.left?1:0),z=(keys.down?1:0)-(keys.up?1:0);const len=Math.hypot(x,z)||1,s=keys.run?10:5.5;player.position.x+=x/len*s*dt;player.position.z+=z/len*s*dt;if(x||z){player.rotation.y=Math.atan2(x,z);player.userData.phase+=dt*10;const sw=Math.sin(player.userData.phase)*.45;player.userData.l.rotation.x=sw;player.userData.r.rotation.x=-sw;player.userData.a.rotation.x=-sw;player.userData.b.rotation.x=sw}camera.position.lerp(player.position.clone().add(new THREE.Vector3(0,5.5,9)),.1);camera.lookAt(player.position.x,2,player.position.z);npcs.forEach(n=>{const t=n.userData.target,d=n.position.distanceTo(t);if(d<3)n.userData.target.set(-200+Math.random()*400,0,-200+Math.random()*400);else{n.position.lerp(t,.12*dt);n.rotation.y=Math.atan2(t.x-n.position.x,t.z-n.position.z);n.userData.phase+=dt*7;const sw=Math.sin(n.userData.phase)*.3;n.userData.l.rotation.x=sw;n.userData.r.rotation.x=-sw}});traffic.forEach(t=>{t.o.position.x+=t.s*dt*8;if(t.o.position.x>330)t.o.position.x=-330});nearest();if(near){statusEl.textContent=near.type==='npc'?'💬 NPC: E se baat karein':near.type==='car'?'🚗 Apni car: E se enter karein':'🚪 '+near.o.userData.name+': front entrance par E dabayein'}else statusEl.textContent='Road, footpath, parks aur buildings explore karein.'}
let last=performance.now(),gameTime=8*60;function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;gameTime=(gameTime+dt*.35)%(24*60);document.querySelector('#clock').textContent=String(Math.floor(gameTime/60)).padStart(2,'0')+':'+String(Math.floor(gameTime%60)).padStart(2,'0');animate(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});camera.position.set(-105,5,-96);camera.lookAt(player.position);
</script></body></html>
