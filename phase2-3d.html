<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DreamCity Pakistan — Phase 2</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8fc7e8;font-family:Arial,sans-serif}#game{position:fixed;inset:0}#hud{position:fixed;inset:0;color:#fff;pointer-events:none}.panel{background:rgba(6,17,28,.9);border:1px solid rgba(255,255,255,.18);border-radius:15px;box-shadow:0 10px 30px #0006;backdrop-filter:blur(8px)}.top{display:flex;justify-content:space-between;padding:14px}.brand,.stats{padding:11px 15px}.brand b{font-size:20px}.hint{position:fixed;left:14px;bottom:14px;padding:12px 15px}.hint b{color:#ffd65a}.actions{position:fixed;right:14px;bottom:14px;display:flex;gap:7px;pointer-events:auto}.actions button,.mobile button{border:1px solid #ffffff25;background:#071321;color:#fff;border-radius:12px;padding:11px 14px;font-weight:bold;cursor:pointer}.mobile{display:none;position:fixed;right:12px;bottom:82px;grid-template-columns:repeat(3,54px);gap:6px;pointer-events:auto}.mobile button{height:54px;padding:0;font-size:20px}.mobile .up{grid-column:2}.mobile .left{grid-column:1;grid-row:2}.mobile .down{grid-column:2;grid-row:2}.mobile .right{grid-column:3;grid-row:2}.mobile .act{grid-column:1/4;font-size:13px}#toast{position:fixed;top:18%;left:50%;transform:translateX(-50%);padding:13px 18px;opacity:0;transition:.2s}.cross{position:fixed;left:50%;top:50%;width:8px;height:8px;border:1px solid white;border-radius:50%;transform:translate(-50%,-50%)}@media(max-width:700px){.mobile{display:grid}.hint{bottom:215px;max-width:280px}.brand b{font-size:15px}.stats{font-size:12px}.actions{left:10px;right:auto}}
</style>
</head>
<body>
<div id="game"></div><div class="cross"></div>
<div id="hud"><div class="top"><div class="panel brand"><b>🏙️ DreamCity Pakistan</b><br><small>Phase 2 • Living City</small></div><div class="panel stats">🪙 <b id="coins">500</b> &nbsp; ⭐ <b>300</b> &nbsp; 🕘 <b id="clock">08:00</b></div></div>
<div class="panel hint">⬆️⬇️⬅️➡️ <b>Move</b> &nbsp; Shift <b>Run</b> &nbsp; E <b>Enter / Interact</b><br><span id="status">City load ho rahi hai...</span></div><div id="toast" class="panel"></div><div class="actions"><button id="help">❓ Help</button><button id="reset">↻ Reset</button></div></div>
<div class="mobile"><button class="up" data-k="up">▲</button><button class="left" data-k="left">◀</button><button class="down" data-k="down">▼</button><button class="right" data-k="right">▶</button><button class="act" id="mact">E • Interact</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var statusEl=document.getElementById('status'),toast=document.getElementById('toast');
function status(t){statusEl.textContent=t;toast.textContent=t;toast.style.opacity=1;clearTimeout(window._toast);window._toast=setTimeout(function(){toast.style.opacity=0},1800)}
if(!window.THREE){status('3D engine load nahi hua. Internet connection check karein.');return;}
var scene=new THREE.Scene();scene.background=new THREE.Color(0x91c9e9);scene.fog=new THREE.Fog(0x91c9e9,150,850);
var camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,1400);
var renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff4ff,0x35452f,2.2));var sun=new THREE.DirectionalLight(0xfff0cf,2.8);sun.position.set(-120,180,90);sun.castShadow=true;sun.shadow.mapSize.width=1024;sun.shadow.mapSize.height=1024;scene.add(sun);
function mat(c,r,m){return new THREE.MeshStandardMaterial({color:c,roughness:r==null?.8:r,metalness:m||0});}
var M={grass:mat(0x4f8a50,1),road:mat(0x303338,1),lane:mat(0xf1c84b,.8),side:mat(0xd1ccc1,1),curb:mat(0xe9e3d8,.9),white:mat(0xf5efe2),glass:mat(0x5c91b1,.18,.15),wall:mat(0xd2c3aa),brick:mat(0x9c6048),blue:mat(0x4776ad),red:mat(0xb94138),green:mat(0x3f784c),dark:mat(0x20252b,.3,.7),wood:mat(0x70452e),yellow:mat(0xe3b63e),skin:mat(0xb97855),pants:mat(0x242a32)};
function box(w,h,d,m,x,y,z,g){var o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;(g||scene).add(o);return o}
function cyl(r,h,m,x,y,z,g){var o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,18),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;(g||scene).add(o);return o}
box(900,.2,900,M.grass,0,-.12,0);
function road(x,z,w,d){box(w,.08,d,M.road,x,0,z);if(w>d){for(var a=-w/2+5;a<w/2;a+=12)box(5,.025,.15,M.lane,x+a,.06,z)}else{for(var a2=-d/2+5;a2<d/2;a2+=12)box(.15,.025,5,M.lane,x,.06,z+a2)}}
function sidewalk(x,z,w,d){box(w,.18,d,M.side,x,.04,z);if(w>d){box(.25,.24,d,M.curb,x+w/2-.2,.16,z);box(.25,.24,d,M.curb,x-w/2+.2,.16,z)}else{box(w,.24,.25,M.curb,x,.16,z+d/2-.2);box(w,.24,.25,M.curb,x,.16,z-d/2+.2)}}
road(0,0,30,820);road(0,0,820,30);road(-230,0,20,820);road(230,0,20,820);road(0,-230,820,20);road(0,230,820,20);road(-115,0,16,820);road(115,0,16,820);road(0,-115,820,16);road(0,115,820,16);
sidewalk(-20,0,9,820);sidewalk(20,0,9,820);sidewalk(-242,0,7,820);sidewalk(242,0,7,820);sidewalk(-123,0,6,820);sidewalk(123,0,6,820);sidewalk(0,-20,820,9);sidewalk(0,20,820,9);sidewalk(0,-123,820,6);sidewalk(0,123,820,6);
function tree(x,z){cyl(.38,3,M.wood,x,1.5,z);cyl(1.55,2.8,M.green,x,3.9,z)}
function lamp(x,z){cyl(.08,5.5,M.dark,x,2.75,z);box(.75,.15,.75,M.yellow,x,5.55,z)}
for(var i=-380;i<=380;i+=38){tree(i,-32);tree(i,32);tree(-32,i);tree(32,i);lamp(i,-25);lamp(i,25);lamp(-25,i);lamp(25,i)}
function label(text){var c=document.createElement('canvas');c.width=600;c.height=120;var q=c.getContext('2d');q.fillStyle='rgba(5,15,25,.9)';q.fillRect(5,5,590,110);q.fillStyle='#fff';q.font='bold 32px Arial';q.textAlign='center';q.fillText(text,300,73);var s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(10,2,1);return s}
var buildings=[];
function building(name,x,z,w,d,floors,color){var g=new THREE.Group();g.position.set(x,0,z);var W=mat(color,.82);box(w,floors*4,d,W,0,floors*2,0,g);for(var f=0;f<floors;f++){for(var xx=-w/2+4;xx<w/2-2;xx+=6){box(3,2.1,.12,M.glass,xx,2.2+f*4,d/2+.08,g);box(3,2.1,.12,M.glass,xx,2.2+f*4,-d/2-.08,g)}box(w-.8,.12,.18,M.white,0,4+f*4,d/2+.1,g)}for(var col=-w/2+2;col<=w/2-2;col+=8)box(.32,floors*4+.2,.3,M.white,col,floors*2,d/2+.2,g);box(5,3.4,.35,M.wood,0,1.7,d/2+.22,g);box(6,.25,.7,M.dark,0,3.7,d/2+.3,g);var s=label(name);s.position.set(0,floors*4+2.8,0);g.add(s);g.userData={name:name,x:x,z:z,w:w,d:d,floors:floors};scene.add(g);buildings.push(g);return g}
building('FAMILY HOUSE',-75,-75,38,30,2,0xc58d63);building('DREAM SCHOOL',75,-75,66,42,3,0xc9d0d6);building('CITY HOSPITAL',-75,75,70,44,5,0xe5e7e8);building('CITY OFFICE',75,75,58,42,6,0x7896b8);building('UNIVERSITY',-230,-75,74,46,5,0xb69a75);building('CITY MARKET',230,75,68,42,3,0x9c6d48);building('POLICE STATION',-230,75,46,34,2,0x6d88a6);building('FIRE STATION',230,-75,50,36,2,0xb94c40);
function park(x,z){box(94,.12,72,M.green,x,0,z);for(var a=-36;a<=36;a+=18){tree(x+a,z-27);tree(x+a,z+27)}box(55,.3,1,M.wood,x,.35,z);box(1,1.2,1,M.dark,x,1,z)}park(0,-170);
function human(sh){var g=new THREE.Group();box(1.1,1.7,.62,sh||M.blue,0,2.35,0,g);cyl(.45,.85,M.skin,0,3.62,0,g);var l=box(.34,1.65,.4,sh||M.blue,-.72,2.3,0,g),r=box(.34,1.65,.4,sh||M.blue,.72,2.3,0,g),a=box(.38,1.7,.42,M.pants,-.25,.82,0,g),b=box(.38,1.7,.42,M.pants,.25,.82,0,g);g.userData={l:l,r:r,a:a,b:b,phase:Math.random()*6};return g}
var player=human(M.blue);player.position.set(-105,0,-105);scene.add(player);
function car(c){var g=new THREE.Group(),bm=mat(c,.3,.25);box(3.4,.8,6,bm,0,1,0,g);box(2.7,.85,2.5,M.glass,0,1.65,-.35,g);for(var x of[-1.7,1.7])for(var z of[-2,2]){var w=cyl(.45,.35,M.dark,x,.45,z,g);w.rotation.z=Math.PI/2}return g}
var myCar=car(0x245f96);myCar.position.set(48,.1,0);scene.add(myCar);var traffic=[];var colors=[0xb73532,0x25282c,0xc79b30,0x39714b,0x6756a1,0xd4d4d4];for(i=0;i<16;i++){var cc=car(colors[i%6]);cc.scale.setScalar(.72);cc.position.set(-390+i*52,.08,(i%2?6:-6));cc.rotation.y=Math.PI/2;scene.add(cc);traffic.push({o:cc,s:.65+Math.random()*.55})}
var npcs=[];for(i=0;i<20;i++){var n=human([M.blue,M.red,M.green,M.wall][i%4]);n.position.set(-190+Math.random()*380,0,-190+Math.random()*380);n.userData.tx=-210+Math.random()*420;n.userData.tz=-210+Math.random()*420;scene.add(n);npcs.push(n)}
function room(title){var g=new THREE.Group();box(34,.12,26,M.side,0,0,0,g);box(34,7,.25,M.wall,0,3.5,-13,g);box(.25,7,26,M.wall,-17,3.5,0,g);box(.25,7,26,M.wall,17,3.5,0,g);var s=label(title);s.position.set(0,5.7,-12.8);g.add(s);return g}
var interior=new THREE.Group();scene.add(interior);interior.visible=false;var rooms=[room('HOUSE • LIVING ROOM'),room('SCHOOL • CLASSROOM'),room('HOSPITAL • PATIENT ROOM'),room('OFFICE • WORK FLOOR')];rooms[0].position.set(-75,0,-70);rooms[1].position.set(75,0,-70);rooms[2].position.set(-75,0,70);rooms[3].position.set(75,0,70);for(i=0;i<rooms.length;i++)interior.add(rooms[i]);
var keys={},inside=false,currentRoom=0,clock=8,driving=false;
function nearestBuilding(){var p=driving?myCar.position:player.position,best=null,bd=999;for(var j=0;j<buildings.length;j++){var b=buildings[j],d=Math.hypot(p.x-b.position.x,p.z-(b.position.z+b.userData.d/2+4));if(d<bd){bd=d;best=b}}return bd<12?best:null}
function enter(){if(driving){driving=false;player.position.copy(myCar.position);player.position.x+=4;status('Car se nikal gaye. E se interact karein.');return}if(inside){inside=false;interior.visible=false;player.visible=true;status('Building se bahar aa gaye.');return}var b=nearestBuilding();if(!b){status('Entrance ke qareeb ja kar E dabayein.');return}var map={'FAMILY HOUSE':0,'DREAM SCHOOL':1,'CITY HOSPITAL':2,'CITY OFFICE':3};if(map[b.userData.name]!=null){currentRoom=map[b.userData.name];inside=true;interior.visible=true;for(var r=0;r<rooms.length;r++)rooms[r].visible=r===currentRoom;player.visible=false;status(b.userData.name+' ke andar. Rooms explore karein.');}else status(b.userData.name+' mein abhi entry system next update mein expand hoga.');}
function drive(){if(inside)return;var d=Math.hypot(player.position.x-myCar.position.x,player.position.z-myCar.position.z);if(d<7){driving=true;player.visible=false;status('Car mein beth gaye. Arrows se drive karein. E se exit.')}}
window.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;if(e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='ArrowLeft'||e.key==='ArrowRight')e.preventDefault();if(e.key.toLowerCase()==='e')enter();if(e.key.toLowerCase()==='f')drive()});window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});
document.getElementById('mact').onclick=function(){enter()};document.querySelectorAll('.mobile button[data-k]').forEach(function(b){b.onpointerdown=function(){keys[b.dataset.k]=true};b.onpointerup=b.onpointerleave=function(){keys[b.dataset.k]=false}});
document.getElementById('help').onclick=function(){status('Arrow keys = move • Shift = run • E = enter/exit • F = car ke qareeb bethna')};document.getElementById('reset').onclick=function(){location.reload()};
function move(){var speed=keys.shift?10:5,dx=0,dz=0;if(keys.arrowup||keys.up)dz-=1;if(keys.arrowdown||keys.down)dz+=1;if(keys.arrowleft||keys.left)dx-=1;if(keys.arrowright||keys.right)dx+=1;if(dx&&dz){dx*=.707;dz*=.707}if(driving){myCar.position.x+=dx*speed*.8;myCar.position.z+=dz*speed*.8;myCar.position.x=Math.max(-390,Math.min(390,myCar.position.x));myCar.position.z=Math.max(-390,Math.min(390,myCar.position.z));myCar.rotation.y=Math.atan2(dx,dz);return}if(inside)return;player.position.x+=dx*speed*.08;player.position.z+=dz*speed*.08;player.position.x=Math.max(-400,Math.min(400,player.position.x));player.position.z=Math.max(-400,Math.min(400,player.position.z));if(dx||dz)player.rotation.y=Math.atan2(dx,dz)}
var last=performance.now();function animate(now){requestAnimationFrame(animate);var dt=Math.min(.04,(now-last)/1000);last=now;move();var t=now*.004;var chars=[player].concat(npcs);for(var q=0;q<chars.length;q++){var h=chars[q];if(h.visible){h.userData.phase+=dt*8;var swing=Math.sin(h.userData.phase)*.25;h.userData.l.rotation.x=swing;h.userData.r.rotation.x=-swing;h.userData.a.rotation.x=-swing*.7;h.userData.b.rotation.x=swing*.7}}for(var k=0;k<traffic.length;k++){var tr=traffic[k];tr.o.position.x+=tr.s*dt*14;if(tr.o.position.x>420)tr.o.position.x=-420}for(k=0;k<npcs.length;k++){var n=npcs[k],vx=n.userData.tx-n.position.x,vz=n.userData.tz-n.position.z,len=Math.hypot(vx,vz);if(len<4){n.userData.tx=-210+Math.random()*420;n.userData.tz=-210+Math.random()*420}else{n.position.x+=vx/len*dt*2.1;n.position.z+=vz/len*dt*2.1;n.rotation.y=Math.atan2(vx,vz)}}var target=driving?myCar:player;camera.position.lerp(new THREE.Vector3(target.position.x,target.position.y+12,target.position.z+20),.08);camera.lookAt(target.position.x,target.position.y+2,target.position.z);document.getElementById('clock').textContent=String(Math.floor(clock)).padStart(2,'0')+':'+String(Math.floor((now/1000)%60)).padStart(2,'0');renderer.render(scene,camera)}
window.addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});status('City ready. Road par arrows se chalain.');requestAnimationFrame(animate);
})();
</script></body></html>
