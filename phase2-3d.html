<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DreamCity Pakistan — Phase 2</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#91c7e7;font-family:Inter,Arial,sans-serif}#game{position:fixed;inset:0}#hud{position:fixed;inset:0;color:#fff;pointer-events:none}.panel{background:rgba(7,15,25,.88);border:1px solid #ffffff22;box-shadow:0 12px 35px #0006;backdrop-filter:blur(10px);border-radius:16px}.top{display:flex;justify-content:space-between;padding:16px}.brand,.stats{padding:12px 16px}.brand b{font-size:20px}.hint{position:fixed;left:16px;bottom:16px;padding:13px 17px}.hint b{color:#ffd45c}.actions{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;pointer-events:auto}.actions button,.mobile button{border:1px solid #fff2;background:#071321e8;color:#fff;border-radius:13px;padding:12px 15px;font-weight:800;cursor:pointer}.mobile{display:none;position:fixed;right:16px;bottom:88px;grid-template-columns:repeat(3,56px);gap:6px;pointer-events:auto}.mobile button{height:56px;padding:0;font-size:21px}.mobile .up{grid-column:2}.mobile .left{grid-column:1;grid-row:2}.mobile .down{grid-column:2;grid-row:2}.mobile .right{grid-column:3;grid-row:2}.mobile .act{grid-column:1/4;font-size:14px}#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);padding:14px 22px;opacity:0;transition:.25s}.cross{position:fixed;left:50%;top:50%;width:8px;height:8px;border:1px solid white;border-radius:50%;transform:translate(-50%,-50%)}@media(max-width:700px){.mobile{display:grid}.hint{bottom:215px;max-width:280px}.top{padding:8px}.brand b{font-size:15px}.stats{font-size:12px}.actions{left:8px;right:auto;bottom:8px}}
</style></head>
<body><div id="game"></div><div class="cross"></div><div id="hud"><div class="top"><div class="panel brand"><b>🏙️ DreamCity Pakistan</b><br><small>Phase 2 • Living City</small></div><div class="panel stats">🪙 <b id="coins">500</b> &nbsp; ⭐ <b>300</b> &nbsp; 🕘 <b id="clock">08:00</b></div></div><div class="panel hint">⬆️⬇️⬅️➡️ <b>Move</b> &nbsp; Shift <b>Run</b> &nbsp; E <b>Interact</b><br><span id="status">Road par chalien. Buildings, NPCs aur cars explore karein.</span></div><div id="toast" class="panel"></div><div class="actions"><button id="help">❓ Help</button><button id="reset">↻ Reset</button></div></div><div class="mobile"><button class="up" data-k="up">▲</button><button class="left" data-k="left">◀</button><button class="down" data-k="down">▼</button><button class="right" data-k="right">▶</button><button class="act" id="mact">E • Interact</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=s=>document.querySelector(s),scene=new THREE.Scene(),root=$('#game');
scene.background=new THREE.Color(0x91c7e7);scene.fog=new THREE.Fog(0x91c7e7,140,720);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,1200);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f7ff,0x34432f,2.4));const sun=new THREE.DirectionalLight(0xfff1cf,3);sun.position.set(-120,180,100);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const M={road:mat(0x292d31,1),lane:mat(0xf1c84b),side:mat(0xc9c4b9),grass:mat(0x4d824b),curb:mat(0xe6e0d5),wall:mat(0xd6c6ad),brick:mat(0x9d5d43),glass:mat(0x4d86a8,.18,.2),white:mat(0xf2eee4),dark:mat(0x20252c,.35,.65),wood:mat(0x6a432b),red:mat(0xb63b35),blue:mat(0x3d6fa8),green:mat(0x3f784d),yellow:mat(0xe3b642),skin:mat(0xb87854),shirt:mat(0x356ca8),pants:mat(0x252a33)};
function box(w,h,d,m,x,y,z,g=scene){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;g.add(o);return o}function cyl(r,h,m,x,y,z,g=scene){let o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;g.add(o);return o}
box(900,.2,900,M.grass,0,-.12,0);
function road(x,z,w,d){box(w,.08,d,M.road,x,0,z);if(w>d)for(let i=-w/2+6;i<w/2;i+=12)box(5,.025,.16,M.lane,x+i,.06,z);else for(let i=-d/2+6;i<d/2;i+=12)box(.16,.025,5,M.lane,x,.06,z+i)}
function sidewalk(x,z,w,d){box(w,.18,d,M.side,x,.05,z);if(w>d){box(.25,.25,d,M.curb,x+w/2-.18,.16,z);box(.25,.25,d,M.curb,x-w/2+.18,.16,z)}else{box(w,.25,.25,M.curb,x,.16,z+d/2-.18);box(w,.25,.25,M.curb,x,.16,z-d/2+.18)}}
road(0,0,28,800);road(0,0,800,28);road(-230,0,20,800);road(230,0,20,800);road(0,-230,800,20);road(0,230,800,20);road(-115,0,16,800);road(115,0,16,800);road(0,-115,800,16);road(0,115,800,16);
sidewalk(-19,0,8,800);sidewalk(19,0,8,800);sidewalk(-242,0,7,800);sidewalk(242,0,7,800);sidewalk(-123,0,6,800);sidewalk(123,0,6,800);sidewalk(0,-19,800,8);sidewalk(0,19,800,8);sidewalk(0,-123,800,6);sidewalk(0,123,800,6);
function tree(x,z){let g=new THREE.Group();cyl(.38,3.2,M.wood,x,1.6,z,g);cyl(1.7,2.8,M.green,x,4,z,g);scene.add(g)}function lamp(x,z){cyl(.09,6,M.dark,x,3,z);box(.8,.16,.8,M.yellow,x,6.15,z)}for(let i=-360;i<=360;i+=32){tree(i,-30);tree(i,30);tree(-30,i);tree(30,i);lamp(i,-24);lamp(i,24);lamp(-24,i);lamp(24,i)}
function sign(text){let c=document.createElement('canvas');c.width=700;c.height=150;let x=c.getContext('2d');x.fillStyle='#071321dd';x.roundRect(5,5,690,140,22);x.fill();x.fillStyle='white';x.font='bold 42px Arial';x.textAlign='center';x.fillText(text,350,92);let s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(11,2.4,1);return s}
const buildings=[];
function building(name,x,z,w,d,floors,color,type='commercial'){let g=new THREE.Group();g.position.set(x,0,z);let W=mat(color,.82);box(w,floors*4,d,W,0,floors*2,0,g);
for(let f=0;f<floors;f++){for(let xx=-w/2+4;xx<w/2-2;xx+=6){box(3,2.1,.12,M.glass,xx,2.2+f*4,d/2+.08,g);box(3,2.1,.12,M.glass,xx,2.2+f*4,-d/2-.08,g)}box(w-.7,.12,.15,M.white,0,4+f*4,d/2+.1,g)}
// facade columns + balcony bands
for(let xx=-w/2+2;xx<=w/2-2;xx+=8)box(.35,floors*4+.2,.35,M.white,xx,floors*2,d/2+.2,g);
box(5,3.4,.3,type==='hospital'?M.glass:M.wood,0,1.7,d/2+.22,g);box(6,.28,.7,M.dark,0,3.7,d/2+.3,g);let l=sign(name);l.position.set(0,floors*4+3,0);g.add(l);g.userData={name,entrance:new THREE.Vector3(x,0,z+d/2+4),type};scene.add(g);buildings.push(g);return g}
const house=building('FAMILY HOUSE',-75,-75,34,28,2,0xc48b60,'house');const school=building('DREAM SCHOOL',75,-75,62,40,3,0xc7ced6,'school');const hospital=building('CITY HOSPITAL',-75,75,66,42,5,0xe3e7e9,'hospital');const office=building('CITY OFFICE',75,75,54,38,6,0x7895b6);const university=building('UNIVERSITY',-230,-75,70,44,5,0xb79a73,'university');const market=building('CITY MARKET',230,75,62,40,3,0x9e6d45,'market');const police=building('POLICE STATION',-230,75,42,32,2,0x6f88a6,'police');const fire=building('FIRE STATION',230,-75,48,34,2,0xb94d3f,'fire');
function park(x,z){box(92,.12,72,M.grass,x,0,z);for(let a=-38;a<=38;a+=19){tree(x+a,z-28);tree(x+a,z+28)}for(let a=-25;a<=25;a+=25){box(5,.6,1,M.wood,x+a,.35,z);box(1,1.2,1,M.dark,x+a,1,z)}}park(0,-170);
function human(shirt=M.shirt){let g=new THREE.Group();box(1.2,1.75,.65,shirt,0,2.4,0,g);cyl(.46,.9,M.skin,0,3.72,0,g);let l=box(.34,1.7,.4,shirt,-.82,2.35,0,g),r=box(.34,1.7,.4,shirt,.82,2.35,0,g),a=box(.4,1.75,.43,M.pants,-.28,.85,0,g),b=box(.4,1.75,.43,M.pants,.28,.85,0,g);g.userData={l,r,a,b,phase:Math.random()*6.28};return g}
const player=human();player.position.set(-105,0,-105);scene.add(player);
function car(color){let g=new THREE.Group(),body=mat(color,.35,.25);box(3.4,.8,6,body,0,1,0,g);box(2.8,.85,2.7,M.glass,0,1.65,-.35,g);box(3,.12,1.2,M.dark,0,.65,0,g);for(let x of[-1.7,1.7])for(let z of[-2,2]){let w=cyl(.48,.38,M.dark,x,.48,z,g);w.rotation.z=Math.PI/2}return g}
let myCar=car(0x1e5e96);myCar.position.set(45,.1,0);scene.add(myCar);let traffic=[];for(let i=0;i<18;i++){let c=car([0x9f302e,0x24272b,0xc89b2d,0x3c704a,0x6855a4,0xd4d4d4][i%6]);c.scale.setScalar(.72);c.position.set(-380+i*45,.08,(i%2?5:-5));c.rotation.y=Math.PI/2;scene.add(c);traffic.push({o:c,s:.7+Math.random()*.8})}
let npcs=[];for(let i=0;i<18;i++){let n=human([M.shirt,M.red,M.green,mat(0x8055a5)][i%4]);n.position.set(-190+Math.random()*380,0,-190+Math.random()*380);n.userData.target=new THREE.Vector3(-210+Math.random()*420,0,-210+Math.random()*420);scene.add(n);npcs.push(n)}
// Interior shells: house, school class, hospital room, office
const interiors=new THREE.Group();scene.add(interiors);interiors.visible=false;function makeRoom(name,color){let g=new THREE.Group();box(34,.15,26,M.side,0,0,0,g);box(34,7,.25,M.wall,0,3.5,-13,g);box(.25,7,26,M.wall,-17,3.5,0,g);box(.25,7,26,M.wall,17,3.5,0,g);let s=sign(name);s.position.set(0,5.8,-12.8);g.add(s);return g}
let houseRoom=makeRoom('HOUSE • LIVING ROOM',M.wall);box(6,2,3,M.red,5,1,2,houseRoom);box(4,1,2,M.wood,-5,.5,-3,houseRoom);box(3,2,.5,M.glass,0,3,-12.8,houseRoom);let schoolRoom=makeRoom('SCHOOL • CLASSROOM');for(let x of[-8,0,8]){box(4,.8,2,M.wood,x,.8,-2,schoolRoom);let st=human(M.blue);st.scale.setScalar(.65);st.position.set(x,0,-1);schoolRoom.add(st)}let hospitalRoom=makeRoom('HOSPITAL • PATIENT ROOM');box(5,.8,10,M.white,-5,.8,1,hospitalRoom);box(3,2,3,M.red,6,1,2,hospitalRoom);let doctor=human(M.white);doctor.position.set(5,0,-4);hospitalRoom.add(doctor);let officeRoom=makeRoom('OFFICE • WORK FLOOR');for(let x of[-8,0,8]){box(5,.7,3,M.wood,x,.7,0,officeRoom);box(2,2,2,M.blue,x,1.2,3,officeRoom)}interiors.add(houseRoom,schoolRoom,hospitalRoom,officeRoom);let currentRoom=houseRoom;currentRoom.visible=true;
let keys={},driving=false,inRoom=false,near=null,coins=500,clock=8;function say(t){$('#status').textContent=t;$('#toast').textContent=t;$('#toast').style.opacity=1;setTimeout(()=>$('#toast').style.opacity=0,1800)}function nearest(){near=null;let p=driving?myCar.position:player.position,dist=999;for(let b of buildings){let d=p.distanceTo(b.userData.entrance);if(d<12&&d<dist){dist=d;near={type:'building',o:b}}}if(!driving&&p.distanceTo(myCar.position)<7)near={type:'car'};for(let n of npcs){if(p.distanceTo(n.position)<5){near={type:'npc',o:n};break}}}
function interact(){if(inRoom){inRoom=false;interiors.visible=false;player.visible=true;player.position.set(-75,0,-88);say('🚪 Bahar aa gaye.');return}nearest();if(!near){say('Qareeb koi door, NPC ya car nahi.');return}if(near.type==='npc'){say('🧑 NPC: Assalam-o-Alaikum! City mein jobs aur shops available hain.');return}if(near.type==='car'){driving=true;player.visible=false;say('🚗 Car mein baith gaye. Arrows se drive karein, E se exit.');return}let b=near.o;if(b===house||b===school||b===hospital||b===office){inRoom=true;interiors.visible=true;for(let r of interiors.children)r.visible=false;let idx=[house,school,hospital,office].indexOf(b);interiors.children[idx].visible=true;player.visible=true;player.position.set(0,0,8);say('🚪 '+b.userData.name+' ke andar aa gaye. Explore karein.')}}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
for(let b of document.querySelectorAll('.mobile button[data-k]')){b.onpointerdown=()=>keys[b.dataset.k]=true;b.onpointerup=b.onpointerleave=()=>keys[b.dataset.k]=false}$('#mact').onclick=interact;$('#help').onclick=()=>say('⬆️⬇️⬅️➡️ Move • Shift Run • E Enter/Exit/Interact');$('#reset').onclick=()=>location.reload();
let last=performance.now();function update(dt){let speed=(keys.shift?13:7)*dt;if(inRoom){if(keys.arrowup||keys.up)player.position.z-=speed;if(keys.arrowdown||keys.down)player.position.z+=speed;if(keys.arrowleft||keys.left)player.position.x-=speed;if(keys.arrowright||keys.right)player.position.x+=speed;return}
let obj=driving?myCar:player;if(keys.arrowup) {obj.position.z-=speed;obj.rotation.y=0}if(keys.arrowdown){obj.position.z+=speed;obj.rotation.y=Math.PI}if(keys.arrowleft){obj.position.x-=speed;obj.rotation.y=-Math.PI/2}if(keys.arrowright){obj.position.x+=speed;obj.rotation.y=Math.PI/2}if(!driving){let moving=keys.arrowup||keys.arrowdown||keys.arrowleft||keys.arrowright;if(moving){let u=obj.userData;u.l.rotation.z=Math.sin(performance.now()/100)%0.55;u.r.rotation.z=-u.l.rotation.z;u.a.rotation.x=-u.l.rotation.z;u.b.rotation.x=u.l.rotation.z}}
if(driving&&keys.e)interact();for(let t of traffic){t.o.position.x+=t.s*dt*8;if(t.o.position.x>390)t.o.position.x=-390}for(let n of npcs){let d=n.position.distanceTo(n.userData.target);if(d<3)n.userData.target.set(-210+Math.random()*420,0,-210+Math.random()*420);else{n.lookAt(n.userData.target.x,n.position.y,n.userData.target.z);n.position.addScaledVector(n.userData.target.clone().sub(n.position).normalize(),dt*2.2);let u=n.userData,u.l.rotation.z=Math.sin(performance.now()/130+u.phase)*.35;u.r.rotation.z=-u.l.rotation.z;u.a.rotation.x=-u.l.rotation.z;u.b.rotation.x=u.l.rotation.z}}
nearest();}
function animate(now){requestAnimationFrame(animate);let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);clock+=dt*.03;let h=Math.floor(clock)%24,m=Math.floor((clock%1)*60);$('#clock').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');let target=driving?myCar:player;let camPos=target.position.clone().add(new THREE.Vector3(0,9,14));camera.position.lerp(camPos,.08);camera.lookAt(target.position.x,target.position.y+2,target.position.z);renderer.render(scene,camera)}animate(performance.now());addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
